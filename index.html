// ── ROBOT ─────────────────────────────────────────────────────
class Robot extends Enemy {
  constructor(x, y, platform) {
    super(x, y, 38, 46);
    this.platform = platform;
    this.fireTimer = CFG.ROBOT_FIRE_RATE;
    this.rollPhase = 0;
  }

  update(player) {
    if (!this.alive) return;
    this._updateTimers();
    if (this.frozenTimer > 0) return;
    this.x += this.facing * 1.8;
    if (this.x < this.platform.x) { this.x = this.platform.x; this.facing = 1; }
    if (this.x + this.w > this.platform.x + this.platform.w) {
      this.x = this.platform.x + this.platform.w - this.w; this.facing = -1;
    }
    this.rollPhase += 0.14;
    if (!Camera.inView(this.x, this.y, this.w, this.h)) return;
    const dx = (player.x+player.w/2)-(this.x+this.w/2);
    this.facing = dx > 0 ? 1 : -1;
    if (Math.abs(dx) < 400) {
      this.fireTimer--;
      if (this.fireTimer <= 0) {
        this.fireTimer = CFG.ROBOT_FIRE_RATE;
        const vx = this.facing * 5;
        enemyProjectiles.push({ type:'wrench', x:this.x+this.w/2, y:this.y+this.h*0.3, vx, vy:-4.5, w:14, h:12, active:true, age:0, spin:0 });
      }
    }
  }

  draw() {
    if (!this.alive && this.deathAnim <= 0) return;
    if (!Camera.inView(this.x, this.y, this.w, this.h)) return;
    const { x: sx, y: sy } = Camera.toScreen(this.x, this.y);
    ctx.save();
    if (this.deathAnim > 0) {
      this.deathAnim--;
      const sc = this.deathAnim/40;
      ctx.globalAlpha = sc;
      ctx.translate(sx+this.w/2,sy+this.h/2); ctx.scale(sc,sc); ctx.translate(-this.w/2,-this.h/2);
    }
    if (this.facing === -1) { ctx.translate(sx+this.w,sy); ctx.scale(-1,1); this._draw(0,0); }
    else this._draw(sx,sy);
    ctx.restore();
  }

  _draw(sx, sy) {
    // Legs/wheels
    ctx.fillStyle = '#374151';
    ctx.beginPath(); ctx.arc(sx+this.w*0.28, sy+this.h, 7, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(sx+this.w*0.72, sy+this.h, 7, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle='#6b7280'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(sx+this.w*0.28,sy+this.h+7); ctx.lineTo(sx+this.w*0.72,sy+this.h+7); ctx.stroke();
    // Body
    const bg = ctx.createLinearGradient(sx,sy+this.h*0.42,sx+this.w,sy+this.h*0.9);
    bg.addColorStop(0,'#9ca3af'); bg.addColorStop(1,'#4b5563');
    ctx.fillStyle = bg;
    ctx.roundRect(sx+2, sy+this.h*0.42, this.w-4, this.h*0.52, 4); ctx.fill();
    // Blue chest panel
    ctx.fillStyle = '#1d4ed8';
    ctx.roundRect(sx+8, sy+this.h*0.52, this.w-16, this.h*0.28, 3); ctx.fill();
    ctx.fillStyle='#60a5fa';
    for (let i=0;i<3;i++) { ctx.beginPath(); ctx.arc(sx+13+i*8,sy+this.h*0.63,2.5,0,Math.PI*2); ctx.fill(); }
    // Head
    ctx.fillStyle='#6b7280';
    ctx.roundRect(sx+5, sy+this.h*0.1, this.w-10, this.h*0.34, 5); ctx.fill();
    // Antenna
    ctx.strokeStyle='#9ca3af'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(sx+this.w/2,sy+this.h*0.1); ctx.lineTo(sx+this.w/2,sy+this.h*0.02); ctx.stroke();
    ctx.fillStyle='#ef4444'; ctx.beginPath(); ctx.arc(sx+this.w/2,sy+this.h*0.02,3.5,0,Math.PI*2); ctx.fill();
    // Eye (single red)
    ctx.fillStyle='#111827'; ctx.roundRect(sx+8,sy+this.h*0.18,this.w-16,this.h*0.16,3); ctx.fill();
    ctx.fillStyle='#ef4444'; ctx.beginPath(); ctx.arc(sx+this.w/2,sy+this.h*0.26,5,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='rgba(255,100,100,0.5)'; ctx.beginPath(); ctx.arc(sx+this.w/2,sy+this.h*0.26,8,0,Math.PI*2); ctx.fill();
    this._drawFrozen(sx, sy);
    this._drawHealthBar(sx, sy);
  }
}

// ── ENEMY PROJECTILE UPDATE & DRAW ────────────────────────────
function updateEnemyProjectiles(player) {
  for (let i = enemyProjectiles.length - 1; i >= 0; i--) {
    const p = enemyProjectiles[i];
    p.x += p.vx; p.vy += 0.3; p.y += p.vy; p.age++;
    if (p.type === 'wrench') p.spin = (p.spin ?? 0) + 0.3;
    if (!p.active || p.x < 0 || p.x > CFG.WORLD_W || p.y > CFG.WORLD_H + 100) {
      enemyProjectiles.splice(i, 1); continue;
    }
    // Check ground / platform landing for goop
    if (p.type === 'goop' && p.vy > 0 && p.y + p.h >= CFG.GROUND_Y) {
      goopPatches.push({ x: p.x - 45, y: CFG.GROUND_Y - 4, w: 90, timer: 360 });
      enemyProjectiles.splice(i, 1); continue;
    }
    // Hit player
    const hit = player.x < p.x+p.w && player.x+player.w > p.x &&
                player.y < p.y+p.h && player.y+player.h > p.y;
    if (hit) {
      player.hurt(p.x);
      if (p.type === 'web') {
        player.trappedTimer = 90; player.trapJumpPresses = 0;
      } else if (p.type === 'goop') {
        goopPatches.push({ x: player.x - 20, y: player.y + player.h - 4, w: 60, timer: 360 });
      }
      enemyProjectiles.splice(i, 1); continue;
    }
  }

  // Update goop patches
  for (let i = goopPatches.length - 1; i >= 0; i--) {
    goopPatches[i].timer--;
    if (goopPatches[i].timer <= 0) { goopPatches.splice(i, 1); continue; }
    // Check if player is in this patch
    const g = goopPatches[i];
    if (player.x + player.w > g.x && player.x < g.x + g.w &&
        Math.abs((player.y + player.h) - g.y) < 14) {
      player.inGoop = true;
    }
  }

  // Update poison dust
  for (let i = poisonDusts.length - 1; i >= 0; i--) {
    const d = poisonDusts[i];
    d.x += d.vx; d.y += d.vy; d.vy += 0.04; d.life -= d.decay;
    if (d.life <= 0) { poisonDusts.splice(i, 1); continue; }
    // Check player hit
    const sc = Camera.toScreen(d.x, d.y);
    if (player.x < d.x+d.r && player.x+player.w > d.x-d.r &&
        player.y < d.y+d.r && player.y+player.h > d.y-d.r) {
      player.hurt(d.x);
    }
  }
}

function drawEnemyProjectiles() {
  for (const p of enemyProjectiles) {
    if (!Camera.inView(p.x, p.y, p.w, p.h)) continue;
    const { x: sx, y: sy } = Camera.toScreen(p.x, p.y);
    if (p.type === 'web') {
      ctx.fillStyle = 'rgba(230,230,255,0.9)';
      ctx.beginPath(); ctx.arc(sx+p.w/2, sy+p.h/2, p.w/2, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#c7d2fe'; ctx.lineWidth = 1;
      for (let ang = 0; ang < Math.PI*2; ang += Math.PI/4) {
        ctx.beginPath(); ctx.moveTo(sx+p.w/2,sy+p.h/2);
        ctx.lineTo(sx+p.w/2+Math.cos(ang)*(p.w/2-1), sy+p.h/2+Math.sin(ang)*(p.h/2-1)); ctx.stroke();
      }
    } else if (p.type === 'goop') {
      ctx.fillStyle = '#4ade80';
      ctx.beginPath(); ctx.ellipse(sx+p.w/2, sy+p.h/2, p.w/2, p.h/2+2, Math.sin(p.age*0.2)*0.4, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = 'rgba(21,128,61,0.6)';
      ctx.beginPath(); ctx.arc(sx+p.w/2, sy+p.h/2, p.w/2-3, 0, Math.PI*2); ctx.fill();
    } else if (p.type === 'apple') {
      ctx.fillStyle = '#16a34a';
      ctx.beginPath(); ctx.arc(sx+p.w/2, sy+p.h/2, p.w/2, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#7e22ce'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(sx+p.w/2, sy+p.h/2, p.w/2-2, 0.3, 0.3+Math.PI*1.5); ctx.stroke();
      ctx.fillStyle = '#422006';
      ctx.fillRect(sx+p.w/2-1, sy+1, 2, 5);
    } else if (p.type === 'wrench') {
      ctx.save(); ctx.translate(sx+p.w/2, sy+p.h/2); ctx.rotate(p.spin ?? 0);
      ctx.fillStyle = '#d1d5db';
      ctx.fillRect(-p.w/2, -3, p.w, 6);
      ctx.beginPath(); ctx.arc(-p.w/2+2, 0, 5, 0, Math.PI*2); ctx.fill();
      ctx.beginPath(); ctx.arc( p.w/2-2, 0, 5, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#6b7280';
      ctx.fillRect(-p.w/2, -1.5, p.w, 3);
      ctx.restore();
    }
  }

  // Draw goop patches
  for (const g of goopPatches) {
    const { x: gsx, y: gsy } = Camera.toScreen(g.x, g.y);
    const alpha = Math.min(1, g.timer / 60);
    ctx.globalAlpha = alpha * 0.65;
    ctx.fillStyle = '#4ade80';
    ctx.beginPath(); ctx.ellipse(gsx + g.w/2, gsy, g.w/2, 8, 0, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
  }

  // Draw poison dust
  for (const d of poisonDusts) {
    const { x: dsx, y: dsy } = Camera.toScreen(d.x, d.y);
    ctx.globalAlpha = d.life * 0.8;
    ctx.fillStyle = '#86efac';
    ctx.shadowColor = '#4ade80'; ctx.shadowBlur = 4;
    ctx.beginPath(); ctx.arc(dsx, dsy, d.r * d.life, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
  }
  ctx.globalAlpha = 1;
}

// ── CHECK ENEMY BODY CONTACT WITH PLAYER ──────────────────────
function checkEnemyContact(player, enemies) {
  if (player.invincible > 0) return;
  for (const e of enemies) {
    if (!e.alive) continue;
    if (player.x + player.w > e.x + 4 && player.x < e.x + e.w - 4 &&
        player.y + player.h > e.y + 4 && player.y < e.y + e.h - 4) {
      player.hurt(e.x + e.w / 2);
    }
  }
}

// ── PLAYER PROJECTILES HIT ENEMIES ────────────────────────────
function checkPlayerProjectilesVsEnemies(enemies) {
  for (let pi = projectiles.length - 1; pi >= 0; pi--) {
    const pr = projectiles[pi];
    for (const e of enemies) {
      if (!e.alive) continue;
      if (pr.x < e.x+e.w && pr.x+pr.w > e.x && pr.y < e.y+e.h && pr.y+pr.h > e.y) {
        e.takeDamage(1, pr.type);
        Particles.spawn(pr.x, pr.y, {
          count: 6, color: pr.type === 'ice' ? '#bae6fd' : '#4ade80',
          size: 4, spread: 3, rise: 2, decay: 0.07,
        });
        pr.active = false;
        break;
      }
    }
  }
}

    new Robot(4000, gnd.y - 46, { x: 3800, y: gnd.y, w: 400 }),

    new WebSpider(4300, p5.y - 32, p5),
    new Robot(4450, p5.y - 46, p5),
    new HauntedTree(4600, p5.y - 80),

    new PoisonButterfly(4500, 350, 250),
  ];
}

// ── HEARTS HUD + GAME-OVER OVERLAY ────────────────────────────
let _gameOver = false;
const _heartAnims = []; // {idx, scale, anim:'pop'|'break', t}

function resetGame() {
  _gameOver = false;
  _heartAnims.length = 0;
  player = new Player(160, 490, activeChar);
  Camera.x = player.x + player.w/2 - Camera.W/2;
  Camera.y = player.y + player.h/2 - Camera.H*0.52;
  Camera.x = Math.max(0, Math.min(Camera.x, CFG.WORLD_W - Camera.W));
  Camera.y = Math.max(0, Math.min(Camera.y, CFG.WORLD_H - Camera.H));
  // Rebuild enemies
  enemies.length = 0;
  enemies.push(...buildEnemies());
}

function drawHearts(player) {
  const HX = canvas.width - 10, HY = 14;
  const HR = 13, GAP = 6;
  const total = CFG.HEARTS_MAX;
  const full  = player.hearts;
  for (let i = total - 1; i >= 0; i--) {
    const sx = HX - (total - i) * (HR * 2 + GAP);
    const sy = HY;
    const isFull = i < full;
    // Check anim
    const anim = _heartAnims.find(a => a.idx === i);
    if (anim) {
      if (anim.anim === 'pop') {
        anim.t++;
        const sc = 1 + Math.sin(anim.t * 0.3) * 0.4 * (1 - anim.t / 20);
        ctx.save(); ctx.translate(sx + HR, sy + HR); ctx.scale(sc, sc);
        _drawHeart(ctx, -HR, -HR, HR * 2, isFull ? '#ef4444' : '#374151');
        ctx.restore();
        if (anim.t >= 20) {
          anim.anim = 'break'; anim.t = 0;
        }
      } else { // break — two halves fall
        anim.t++;
        const fall = anim.t * anim.t * 0.08;
        const spread = anim.t * 1.5;
        ctx.save(); ctx.globalAlpha = Math.max(0, 1 - anim.t / 30);
        ctx.fillStyle = '#ef4444';
        // Left half
        ctx.save(); ctx.translate(sx + HR - spread, sy + HR + fall); ctx.rotate(-0.4);
        ctx.beginPath(); ctx.arc(0, 0, HR * 0.8, Math.PI, 0); ctx.fill();
        ctx.restore();
        // Right half
        ctx.save(); ctx.translate(sx + HR + spread, sy + HR + fall); ctx.rotate(0.4);
        ctx.beginPath(); ctx.arc(0, 0, HR * 0.8, Math.PI, 0); ctx.fill();
        ctx.restore();
        ctx.restore();
        if (anim.t >= 30) _heartAnims.splice(_heartAnims.indexOf(anim), 1);
      }
    } else {
      _drawHeart(ctx, sx, sy, HR * 2, isFull ? '#ef4444' : '#374151');
      if (!isFull) {
        ctx.strokeStyle = '#6b7280'; ctx.lineWidth = 1.5;
        _drawHeartStroke(ctx, sx, sy, HR * 2);
      }
    }
  }
}

function _drawHeart(ctx, x, y, size, color) {
  const cx = x + size/2, cy = y + size*0.42;
  const r = size * 0.28;
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.arc(cx - r * 0.9, cy, r, Math.PI, 0);
  ctx.arc(cx + r * 0.9, cy, r, Math.PI, 0);
  ctx.lineTo(cx, cy + size * 0.52);
  ctx.closePath(); ctx.fill();
}
function _drawHeartStroke(ctx, x, y, size) {
  const cx = x + size/2, cy = y + size*0.42;
  const r = size * 0.28;
  ctx.beginPath();
  ctx.arc(cx - r * 0.9, cy, r, Math.PI, 0);
  ctx.arc(cx + r * 0.9, cy, r, Math.PI, 0);
  ctx.lineTo(cx, cy + size * 0.52);
  ctx.closePath(); ctx.stroke();
}

function triggerHeartLoss(idx) {
  if (!_heartAnims.find(a => a.idx === idx)) {
    _heartAnims.push({ idx, anim: 'pop', t: 0 });
  }
}

let _prevHearts = CFG.HEARTS_MAX;
function checkHeartChange(player) {
  if (player.hearts < _prevHearts) {
    for (let i = _prevHearts - 1; i >= player.hearts; i--) {
      triggerHeartLoss(i);
    }
  }
  _prevHearts = player.hearts;
  if (player.hearts <= 0 && !_gameOver) _gameOver = true;
}

function drawGameOver() {
  ctx.fillStyle = 'rgba(0,0,0,0.72)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#fde68a';
  ctx.font = 'bold 56px Georgia';
  ctx.shadowColor = '#f87171'; ctx.shadowBlur = 20;
  ctx.fillText('Oh no!', canvas.width/2, canvas.height*0.38);
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#fff';
  ctx.font = '24px Georgia';
  ctx.fillText('Tap or press any key to try again', canvas.width/2, canvas.height*0.56);
  ctx.textAlign = 'left';
}

// ═══════════════════════════════════════════════════════════════
//  HUD
// ═══════════════════════════════════════════════════════════════
function drawHUD(player) {
  // Character badge (top-left)
  ctx.fillStyle = 'rgba(0,0,0,0.38)';
  ctx.roundRect(10, 10, 220, 38, 8);
  ctx.fill();

  const isPen = player.character === 'penelope';
  ctx.fillStyle = isPen ? '#c084fc' : '#67e8f9';
  ctx.font = 'bold 13px Georgia';
  ctx.fillText(isPen ? '✨ Penelope  —  Magic Elf'
                     : '🧚 Parker  —  Magical Fairy', 18, 33);

  // Hearts (top-right)
  drawHearts(player);

  // Switch hint — below hearts, small
  ctx.fillStyle = 'rgba(255,255,255,0.45)';
  ctx.font = '10px Georgia';
  ctx.textAlign = 'right';
  ctx.fillText(IS_TOUCH ? 'SWAP: switch' : '[Tab] switch', canvas.width - 10, 50);
  ctx.textAlign = 'left';

  // Keyboard controls bar — only shown on non-touch devices
  if (!IS_TOUCH) {
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.roundRect(10, canvas.height - 26, 400, 18, 5);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.65)';
    ctx.font = '10px Georgia';
    ctx.fillText('← → Move     ↑ Jump (double-jump!)     Space Shoot', 16, canvas.height - 13);
  }
}

// ═══════════════════════════════════════════════════════════════
//  SELECT SCREEN
// ═══════════════════════════════════════════════════════════════
const SelectScreen = (() => {
  // Preview sizes — tall and slender in the select screen
  const PW = 82, PH = 190;
  let hovered = null; // 'penelope' | 'parker' | null
  let t = 0;

  function panelRect(char) {
    const gap = NATIVE_W * 0.08;
    const pw  = NATIVE_W * 0.36, ph = NATIVE_H * 0.82;
    const py  = NATIVE_H * 0.09;
    if (char === 'penelope') return { x: NATIVE_W * 0.5 - gap * 0.5 - pw, y: py, w: pw, h: ph };
    else                     return { x: NATIVE_W * 0.5 + gap * 0.5,      y: py, w: pw, h: ph };
  }

  function hitTest(px, py) {
    for (const ch of ['penelope','parker']) {
      const r = panelRect(ch);
      if (px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h) return ch;
    }
    return null;
  }

  function onPointer(e) {
    if (gameState !== 'select') return;
    const rect = canvas.getBoundingClientRect();
    const src = e.changedTouches?.[0] ?? e;
    const rawX = src.clientX - rect.left;
    const rawY = src.clientY - rect.top;
    const px = rawX / _cssScale, py = rawY / _cssScale;
    const ch = hitTest(px, py);
    if (e.type === 'mousemove' || e.type === 'touchmove') { hovered = ch; return; }
    if (ch) selectCharacter(ch);
  }

  canvas.addEventListener('click',     onPointer);
  canvas.addEventListener('touchend',  onPointer, { passive: false });
  canvas.addEventListener('mousemove', onPointer);

  function draw() {
    t++;
    // Dark starfield background
    const bg = ctx.createLinearGradient(0, 0, 0, NATIVE_H);
    bg.addColorStop(0, '#0c0a1e'); bg.addColorStop(1, '#1a1040');
    ctx.fillStyle = bg; ctx.fillRect(0, 0, NATIVE_W, NATIVE_H);

    // Twinkling stars
    for (let i = 0; i < 60; i++) {
      const sx = (i * 317 + 7) % NATIVE_W;
      const sy = (i * 211 + 3) % NATIVE_H;
      const pulse = (Math.sin(t * 0.04 + i * 1.1) + 1) * 0.5;
      ctx.globalAlpha = 0.15 + pulse * 0.7;
      ctx.fillStyle = i % 3 === 0 ? '#fde68a' : '#c7d2fe';
      ctx.beginPath(); ctx.arc(sx, sy, 1 + pulse, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Title
    ctx.textAlign = 'center';
    ctx.font = 'bold 32px Georgia';
    ctx.fillStyle = '#fbbf24';
    ctx.shadowColor = '#f59e0b'; ctx.shadowBlur = 18;
    ctx.fillText('✨ Choose Your Hero ✨', NATIVE_W / 2, 52);
    ctx.shadowBlur = 0;
    ctx.font = '14px Georgia';
    ctx.fillStyle = 'rgba(199,210,254,0.7)';
    ctx.fillText('Tap a character to begin your adventure', NATIVE_W / 2, 74);
    ctx.textAlign = 'left';

    for (const ch of ['penelope','parker']) {
      const r = panelRect(ch);
      const isPen = ch === 'penelope';
      const isHov = hovered === ch;
      const pulse = Math.sin(t * 0.06 + (isPen ? 0 : Math.PI)) * 0.5 + 0.5;

      // Panel glow
      if (isHov) {
        ctx.shadowColor = isPen ? '#38bdf8' : '#a78bfa';
        ctx.shadowBlur = 24;
      }
      // Panel background
      const pg = ctx.createLinearGradient(r.x, r.y, r.x, r.y + r.h);
      if (isPen) {
        pg.addColorStop(0, isHov ? 'rgba(14,116,144,0.85)' : 'rgba(12,74,110,0.7)');
        pg.addColorStop(1, isHov ? 'rgba(3,105,161,0.65)'  : 'rgba(2,48,71,0.6)');
      } else {
        pg.addColorStop(0, isHov ? 'rgba(88,28,135,0.85)'  : 'rgba(59,7,100,0.7)');
        pg.addColorStop(1, isHov ? 'rgba(107,33,168,0.65)' : 'rgba(46,16,101,0.6)');
      }
      ctx.fillStyle = pg;
      ctx.roundRect(r.x, r.y, r.w, r.h, 18); ctx.fill();
      ctx.shadowBlur = 0;

      // Panel border
      ctx.strokeStyle = isPen ? (isHov ? '#38bdf8' : '#0ea5e9') : (isHov ? '#d8b4fe' : '#9333ea');
      ctx.lineWidth = isHov ? 3 : 1.5;
      ctx.roundRect(r.x, r.y, r.w, r.h, 18); ctx.stroke();

      // Character preview — centered in panel, slightly above center
      const pcx = r.x + r.w / 2;
      const pcy = r.y + r.h * 0.44;
      const bob = Math.sin(t * 0.05 + (isPen ? 0 : 1)) * 4;
      ctx.save();
      ctx.translate(pcx, pcy + bob);
      if (isPen) drawPenelopeSprite(-PW/2, -PH/2, PW, PH, 'idle', t, false);
      else       drawParkerSprite(-PW/2, -PH/2, PW, PH, isPen ? 'idle' : (Math.sin(t*0.03) > 0 ? 'jump' : 'idle'), t, t * 0.08);
      ctx.restore();

      // Name
      ctx.textAlign = 'center';
      ctx.font = 'bold 20px Georgia';
      ctx.fillStyle = isPen ? '#bae6fd' : '#e9d5ff';
      ctx.shadowColor = isPen ? '#0ea5e9' : '#9333ea'; ctx.shadowBlur = 8;
      ctx.fillText(isPen ? 'PENELOPE' : 'PARKER', r.x + r.w / 2, r.y + r.h * 0.74);
      ctx.shadowBlur = 0;

      // Class
      ctx.font = 'italic 13px Georgia';
      ctx.fillStyle = isPen ? '#7dd3fc' : '#c4b5fd';
      ctx.fillText(isPen ? 'Magic Elf Archer' : 'Fairy Spellcaster', r.x + r.w / 2, r.y + r.h * 0.81);

      // Ability
      ctx.font = '11px Georgia';
      ctx.fillStyle = isPen ? '#bae6fd' : '#ddd6fe';
      ctx.fillText(isPen ? '❄ Ice / Freeze Arrows' : '🌿 Poison Vine Shots', r.x + r.w / 2, r.y + r.h * 0.88);

      // CHOOSE button
      const bh = 34, bw2 = r.w * 0.6, bx = r.x + (r.w - bw2) / 2, by = r.y + r.h * 0.915;
      const btnG = ctx.createLinearGradient(bx, by, bx, by + bh);
      if (isPen) { btnG.addColorStop(0, isHov ? '#0ea5e9' : '#0284c7'); btnG.addColorStop(1, isHov ? '#0369a1' : '#01579b'); }
      else       { btnG.addColorStop(0, isHov ? '#9333ea' : '#7c3aed'); btnG.addColorStop(1, isHov ? '#6b21a8' : '#4c1d95'); }
      ctx.fillStyle = btnG;
      ctx.roundRect(bx, by, bw2, bh, 10); ctx.fill();
      ctx.strokeStyle = isPen ? '#7dd3fc' : '#c4b5fd'; ctx.lineWidth = 1.5;
      ctx.roundRect(bx, by, bw2, bh, 10); ctx.stroke();
      ctx.font = 'bold 14px Georgia';
      ctx.fillStyle = '#fff';
      ctx.shadowColor = isPen ? '#38bdf8' : '#a855f7'; ctx.shadowBlur = isHov ? 10 : 0;
      ctx.fillText(isPen ? 'Choose Penelope' : 'Choose Parker', r.x + r.w / 2, by + bh * 0.65);
      ctx.shadowBlur = 0; ctx.textAlign = 'left';

      // Floating sparkles around hovered panel
      if (isHov) {
        for (let s = 0; s < 5; s++) {
          const sa = t * 0.08 + s * 1.26;
          const sr = r.w * 0.52 + Math.sin(t * 0.04 + s) * 8;
          const sx = r.x + r.w/2 + Math.cos(sa) * sr;
          const sy2 = r.y + r.h/2 + Math.sin(sa) * sr * 0.4;
          ctx.fillStyle = isPen ? `rgba(186,230,253,${0.4 + pulse * 0.5})` : `rgba(216,180,254,${0.4 + pulse * 0.5})`;
          ctx.beginPath(); ctx.arc(sx, sy2, 2.5 + pulse, 0, Math.PI * 2); ctx.fill();
        }
      }
    }
  }

  return { draw };
})();

// ═══════════════════════════════════════════════════════════════
//  GAME INIT & LOOP
// ═══════════════════════════════════════════════════════════════
const platforms = buildSkyIslandWorld();
const flowers   = buildGroundFlowers();
const enemies   = buildEnemies();
let gameState = 'select'; // 'select' | 'playing'
let activeChar = 'penelope';
let player = null;

function selectCharacter(ch) {
  activeChar = ch;
  player = new Player(160, 490, ch);
  _prevHearts = CFG.HEARTS_MAX;
  _gameOver = false;
  gameState = 'playing';
  Camera.x = player.x + player.w / 2 - Camera.W / 2;
  Camera.y = player.y + player.h / 2 - Camera.H * 0.52;
  Camera.x = Math.max(0, Math.min(Camera.x, CFG.WORLD_W - Camera.W));
  Camera.y = Math.max(0, Math.min(Camera.y, CFG.WORLD_H - Camera.H));
}

function switchCharacter() {
  activeChar = activeChar === 'penelope' ? 'parker' : 'penelope';
  const np = new Player(player.x, player.y, activeChar);
  np.vx = player.vx; np.vy = -4;
  np.hearts     = player.hearts;
  np.invincible = player.invincible;
  np.airJumps   = player.airJumps;
  np.trappedTimer = player.trappedTimer;
  player = np;
  _prevHearts = player.hearts;
  Particles.spawn(player.x + player.w / 2, player.y + player.h / 2, {
    count: 14, color: activeChar === 'penelope' ? '#c084fc' : '#67e8f9',
    spread: 5, rise: 4, star: true, size: 6, decay: 0.02,
  });
}

window.addEventListener('keydown', e => {
  if (e.code === 'Tab') { e.preventDefault(); if (gameState === 'playing') switchCharacter(); }
  if (_gameOver && gameState === 'playing') resetGame();
});
canvas.addEventListener('click', e => { if (_gameOver && gameState === 'playing') resetGame(); });
canvas.addEventListener('touchend', e => { if (_gameOver && gameState === 'playing') { e.preventDefault(); resetGame(); } }, { passive: false });

function gameLoop() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (gameState === 'select') {
    SelectScreen.draw();
    Input.clearFrame();
    requestAnimationFrame(gameLoop);
    return;
  }

  // ── Playing: Update ─────────────────────────────────────────
  if (!_gameOver) {
    player.update([...platforms, ...flowers]);
    for (const f of flowers) f.update(player);
    for (const e of enemies) e.update(player);
    updateEnemyProjectiles(player);
    checkEnemyContact(player, enemies);
    checkPlayerProjectilesVsEnemies(enemies);
    checkHeartChange(player);
    Camera.update(player);
    BG.update();
    Particles.update();

    for (let i = projectiles.length - 1; i >= 0; i--) {
      projectiles[i].update();
      if (!projectiles[i].active) projectiles.splice(i, 1);
    }

    if (TouchControls.consumeShoot() || Input.wasPressed('Space')) shootAction(player);
    if (TouchControls.consumeSwap()) switchCharacter();
  }
  Input.clearFrame();

  // ── Playing: Draw ───────────────────────────────────────────
  BG.draw();
  for (const p of platforms) p.draw();
  for (const f of flowers) f.draw();
  for (const e of enemies) e.draw();
  drawEnemyProjectiles();
  Particles.draw();
  for (const pr of projectiles) pr.draw();
  player.draw();
  drawHUD(player);
  if (_gameOver) drawGameOver();
  TouchControls.draw();

  requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);
</script>
