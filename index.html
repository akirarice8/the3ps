<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>The 3 P's Heroic Adventure</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #0c1445;
      overflow: hidden;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      font-family: Georgia, serif;
    }
    #wrapper {
      width: 100vw;
      height: 100dvh; /* dynamic viewport height — respects iPad browser chrome */
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas {
      display: block;
      /* CSS size set by JS to fill screen while keeping 900×506 aspect ratio */
      touch-action: none;
    }
  </style>
</head>
<body>
<div id="wrapper">
<canvas id="gameCanvas" width="900" height="506"></canvas>
</div>

<script>
// ═══════════════════════════════════════════════════════════════
//  THE 3 P'S HEROIC ADVENTURE  —  Session 1: Sky Island World
//  Architecture: Input → Update (Physics/AI) → Draw
//  Future hooks: enemies[], projectiles[], worlds[], helpers[]
// ═══════════════════════════════════════════════════════════════

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// ── Responsive full-screen scaling ────────────────────────────
// Internal resolution is fixed at 900×506; CSS scales to fill the viewport.
// All game coordinates (camera, HUD, touch hit-tests) stay in 900×506 space.
const NATIVE_W = 900, NATIVE_H = 506;
let _cssScale = 1; // current CSS px per canvas px — used for touch mapping

function resizeCanvas() {
  const sw = window.innerWidth, sh = window.innerHeight;
  _cssScale = Math.min(sw / NATIVE_W, sh / NATIVE_H);
  canvas.style.width  = (_cssScale * NATIVE_W) + 'px';
  canvas.style.height = (_cssScale * NATIVE_H) + 'px';
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// Touch detection (hide keyboard hints when touch device)
const IS_TOUCH = 'ontouchstart' in window || navigator.maxTouchPoints > 0;

// ── Tunable constants ─────────────────────────────────────────
const CFG = {
  GRAVITY:            0.42,
  FALL_GRAVITY:       0.22,
  JUMP_FORCE:        -11.5,
  DOUBLE_JUMP_FORCE: -10,    // second air jump (weaker)
  MOVE_SPEED:         4.8,
  FRICTION:           0.76,
  TERMINAL_VEL:       6.5,
  WORLD_W:           5000,
  WORLD_H:           1000,
  CAM_LERP:          0.09,
  GROUND_Y:           900,
  BOUNCE_FORCE:      -20,
  FLYTRAP_DELAY:      60,
  HEARTS_MAX:          5,
  INVINCIBLE_FRAMES:  90,    // 1.5 s @ 60 fps
  SPIDER_FIRE_RATE:  150,    // frames between web shots
  GHOST_FIRE_RATE:   180,
  TREE_FIRE_RATE:    180,
  ROBOT_FIRE_RATE:   150,
};

// ── roundRect: always call beginPath() first ──────────────────
// Native roundRect (Chrome/Safari/Firefox) does NOT call beginPath(),
// so leftover paths from prior drawing get re-filled by subsequent fill().
// We wrap the native to inject beginPath(), or install a full polyfill.
(function() {
  const proto = CanvasRenderingContext2D.prototype;
  const _native = proto.roundRect;
  if (_native) {
    proto.roundRect = function(x, y, w, h, r) {
      this.beginPath();
      _native.call(this, x, y, w, h, r);
    };
  } else {
    proto.roundRect = function(x, y, w, h, r) {
      if (Array.isArray(r)) r = r[0] ?? 0;
      r = Math.min(r || 0, w / 2, h / 2);
      this.beginPath();
      this.moveTo(x + r, y);
      this.lineTo(x + w - r, y);
      this.arcTo(x + w, y, x + w, y + r, r);
      this.lineTo(x + w, y + h - r);
      this.arcTo(x + w, y + h, x + w - r, y + h, r);
      this.lineTo(x + r, y + h);
      this.arcTo(x, y + h, x, y + h - r, r);
      this.lineTo(x, y + r);
      this.arcTo(x, y, x + r, y, r);
      this.closePath();
    };
  }
})();

// ═══════════════════════════════════════════════════════════════
//  INPUT  (keyboard + touch — both update the same logical state)
// ═══════════════════════════════════════════════════════════════

// Touch button state — written by TouchControls, read by Input
const _touch = { left: false, right: false, jump: false };

const Input = (() => {
  const held = {};
  const pressed = {};
  window.addEventListener('keydown', e => {
    if (!held[e.code]) pressed[e.code] = true;
    held[e.code] = true;
    if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Tab'].includes(e.code))
      e.preventDefault();
  });
  window.addEventListener('keyup', e => { held[e.code] = false; });
  return {
    left:       () => held['ArrowLeft']  || held['KeyA']  || _touch.left,
    right:      () => held['ArrowRight'] || held['KeyD']  || _touch.right,
    jump:       () => held['ArrowUp'] || held['KeyW'] || _touch.jump,
    wasPressed: (code) => { const v = pressed[code]; pressed[code] = false; return v; },
    clearFrame: () => { for (const k in pressed) pressed[k] = false; },
  };
})();

// ═══════════════════════════════════════════════════════════════
//  TOUCH CONTROLS
//  Bottom-left : [◀] [▶]
//  Bottom-center: [SWAP]  (character switch)
//  Bottom-right : [✦ SHOOT] [▲ JUMP]
//  All coords in 900×506 canvas-space; hit-tests divide by _cssScale.
// ═══════════════════════════════════════════════════════════════
const TouchControls = (() => {
  const S  = 84;   // button size (canvas px)
  const G  = 10;   // gap between sibling buttons
  const SW = 72;   // swap button width (slightly narrower)
  const MX = 22;   // margin from canvas edge
  const MY = 18;   // margin from canvas bottom

  function toCanvas(clientX, clientY) {
    const r = canvas.getBoundingClientRect();
    return {
      x: (clientX - r.left) / _cssScale,
      y: (clientY - r.top)  / _cssScale,
    };
  }

  function rect(id) {
    const y  = NATIVE_H - MY - S;
    const sy = NATIVE_H - MY - S + (S - SW) / 2;  // vertically center swap
    switch (id) {
      case 'left':  return { x: MX,                           y,  w: S,  h: S  };
      case 'right': return { x: MX + S + G,                   y,  w: S,  h: S  };
      case 'swap':  return { x: NATIVE_W / 2 - SW / 2,        y: sy, w: SW, h: SW };
      case 'shoot': return { x: NATIVE_W - MX - S * 2 - G,    y,  w: S,  h: S  };
      case 'jump':  return { x: NATIVE_W - MX - S,            y,  w: S,  h: S  };
    }
  }

  function hit(cx, cy, id) {
    const r = rect(id);
    return cx >= r.x && cx <= r.x + r.w && cy >= r.y && cy <= r.y + r.h;
  }

  // One-shot flags for tap actions
  let _shootFired = false, _shootFlash = 0;
  let _swapFired  = false, _swapFlash  = 0;
  let _jumpFired  = false;

  function syncHeld(touches) {
    _touch.left = false; _touch.right = false; _touch.jump = false;
    for (let i = 0; i < touches.length; i++) {
      const { x, y } = toCanvas(touches[i].clientX, touches[i].clientY);
      if (hit(x, y, 'left'))  _touch.left  = true;
      if (hit(x, y, 'right')) _touch.right = true;
      if (hit(x, y, 'jump'))  _touch.jump  = true;
    }
  }

  canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    syncHeld(e.touches);
    for (let i = 0; i < e.changedTouches.length; i++) {
      const { x, y } = toCanvas(e.changedTouches[i].clientX, e.changedTouches[i].clientY);
      if (hit(x, y, 'shoot')) { _shootFired = true; _shootFlash = 10; }
      if (hit(x, y, 'swap'))  { _swapFired  = true; _swapFlash  = 12; }
      if (hit(x, y, 'jump'))  { _jumpFired  = true; }
    }
  }, { passive: false });

  canvas.addEventListener('touchmove',   e => { e.preventDefault(); syncHeld(e.touches); }, { passive: false });
  canvas.addEventListener('touchend',    e => { e.preventDefault(); syncHeld(e.touches); }, { passive: false });
  canvas.addEventListener('touchcancel', e => {
    e.preventDefault();
    _touch.left = false; _touch.right = false; _touch.jump = false;
  }, { passive: false });

  function consumeShoot() {
    const v = _shootFired; _shootFired = false;
    if (_shootFlash > 0) _shootFlash--;
    return v;
  }
  function consumeSwap() {
    const v = _swapFired; _swapFired = false;
    if (_swapFlash > 0) _swapFlash--;
    return v;
  }
  function consumeJump() {
    const v = _jumpFired; _jumpFired = false; return v;
  }

  // ── Button rendering ──────────────────────────────────────
  const themes = {
    left:  { a: '#14532d', b: '#052e16', border: '#4ade80', icon: '◀',       twoLine: false },
    right: { a: '#14532d', b: '#052e16', border: '#4ade80', icon: '▶',       twoLine: false },
    swap:  { a: '#92400e', b: '#451a03', border: '#fbbf24', icon: '✨\nSWAP', twoLine: true  },
    shoot: { a: '#4c1d95', b: '#2e1065', border: '#c084fc', icon: '✦\nSHOOT',twoLine: true  },
    jump:  { a: '#075985', b: '#0c4a6e', border: '#38bdf8', icon: '▲\nJUMP', twoLine: true  },
  };

  function drawBtn(id, active) {
    const r = rect(id);
    const t = themes[id];
    const oy = active ? 2 : 0;  // press-down shift

    // Hard drop shadow — gives depth against any background
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.roundRect(r.x + 4, r.y + 6 + oy, r.w, r.h, 18);
    ctx.fill();

    // Dark outer ring (contrast ring that works on both light and dark BG)
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.roundRect(r.x - 2, r.y - 2 + oy, r.w + 4, r.h + 4, 20);
    ctx.fill();

    // Button body — fully opaque gradient
    const grad = ctx.createLinearGradient(r.x, r.y + oy, r.x, r.y + r.h + oy);
    grad.addColorStop(0, active ? t.b : t.a);
    grad.addColorStop(1, active ? t.a : t.b);
    ctx.fillStyle = grad;
    ctx.globalAlpha = 1;
    ctx.roundRect(r.x, r.y + oy, r.w, r.h, 18);
    ctx.fill();

    // Coloured border — always full opacity so it reads clearly
    ctx.strokeStyle = t.border;
    ctx.lineWidth = active ? 3 : 2.5;
    if (active) { ctx.shadowColor = t.border; ctx.shadowBlur = 16; }
    ctx.roundRect(r.x, r.y + oy, r.w, r.h, 18);
    ctx.stroke();
    ctx.shadowBlur = 0;

    // Inner highlight strip (top edge glint)
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    ctx.roundRect(r.x + 6, r.y + oy + 4, r.w - 12, r.h * 0.3, 10);
    ctx.fill();

    // Label text with strong shadow so it pops off any colour
    ctx.fillStyle = '#ffffff';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = 'rgba(0,0,0,0.9)';
    ctx.shadowBlur = 6;
    const cy = r.y + oy + r.h / 2;
    if (!t.twoLine) {
      ctx.font = `bold ${Math.round(r.h * 0.52)}px Georgia`;
      ctx.fillText(t.icon, r.x + r.w / 2, cy);
    } else {
      const [top, bot] = t.icon.split('\n');
      ctx.font = `bold ${Math.round(r.h * 0.32)}px Georgia`;
      ctx.fillText(top, r.x + r.w / 2, cy - r.h * 0.14);
      ctx.font = `bold ${Math.round(r.h * 0.21)}px Georgia`;
      ctx.fillText(bot, r.x + r.w / 2, cy + r.h * 0.22);
    }
    ctx.shadowBlur = 0;
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
  }

  function draw() {
    if (!IS_TOUCH) return;
    drawBtn('left',  _touch.left);
    drawBtn('right', _touch.right);
    drawBtn('swap',  _swapFlash > 0);
    drawBtn('shoot', _shootFlash > 0);
    drawBtn('jump',  _touch.jump);
  }

  return { consumeShoot, consumeSwap, consumeJump, draw };
})();

// ═══════════════════════════════════════════════════════════════
//  CAMERA
// ═══════════════════════════════════════════════════════════════
const Camera = {
  x: 0, y: 0,
  W: canvas.width, H: canvas.height,

  update(target) {
    const tx = target.x + target.w / 2 - this.W / 2;
    const ty = target.y + target.h / 2 - this.H * 0.52;
    this.x += (tx - this.x) * CFG.CAM_LERP;
    this.y += (ty - this.y) * CFG.CAM_LERP;
    this.x = Math.max(0, Math.min(this.x, CFG.WORLD_W - this.W));
    this.y = Math.max(0, Math.min(this.y, CFG.WORLD_H - this.H));
  },

  toScreen(wx, wy) { return { x: wx - this.x, y: wy - this.y }; },

  inView(x, y, w, h, pad = 60) {
    return x + w > this.x - pad && x < this.x + this.W + pad &&
           y + h > this.y - pad && y < this.y + this.H + pad;
  },
};

// ═══════════════════════════════════════════════════════════════
//  PARTICLES  (sparkles, dust, landing puffs)
// ═══════════════════════════════════════════════════════════════
const Particles = (() => {
  const pool = [];

  function spawn(x, y, opts = {}) {
    const count = opts.count ?? 6;
    for (let i = 0; i < count; i++) {
      pool.push({
        x, y,
        vx: (Math.random() - 0.5) * (opts.spread ?? 3.5),
        vy: -Math.random() * (opts.rise ?? 3) - 0.5,
        color: opts.color ?? '#fbbf24',
        size:  Math.random() * (opts.size ?? 4) + 2,
        life:  1,
        decay: opts.decay ?? 0.025,
        gravity: opts.gravity ?? 0.06,
        star: opts.star ?? false,
      });
    }
  }

  function update() {
    for (let i = pool.length - 1; i >= 0; i--) {
      const p = pool[i];
      p.x += p.vx; p.y += p.vy;
      p.vy += p.gravity;
      p.vx *= 0.97;
      p.life -= p.decay;
      if (p.life <= 0) pool.splice(i, 1);
    }
  }

  function draw() {
    for (const p of pool) {
      const s = Camera.toScreen(p.x, p.y);
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      if (p.star) {
        drawStar(ctx, s.x, s.y, p.size * p.life, 5, p.color);
      } else {
        ctx.beginPath();
        ctx.arc(s.x, s.y, p.size * p.life, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
  }

  return { spawn, update, draw };
})();

// Shared star draw helper
function drawStar(ctx, cx, cy, r, points, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  for (let i = 0; i < points * 2; i++) {
    const angle = (i * Math.PI) / points - Math.PI / 2;
    const rad   = i % 2 === 0 ? r : r * 0.42;
    if (i === 0) ctx.moveTo(cx + rad * Math.cos(angle), cy + rad * Math.sin(angle));
    else         ctx.lineTo(cx + rad * Math.cos(angle), cy + rad * Math.sin(angle));
  }
  ctx.closePath();
  ctx.fill();
}

// ═══════════════════════════════════════════════════════════════
//  CHARACTER SPRITES
//  Standalone functions — called by Player and SelectScreen.
//  x,y = top-left of bounding box; w,h = box size.
//  All internal positions are fractions of w/h so they scale.
// ═══════════════════════════════════════════════════════════════

function drawPenelopeSprite(x, y, w, h, state, animFrame, aiming) {
  const cx = x + w / 2;
  const af = animFrame || 0;
  const run = state === 'run';
  const armSwing = run ? Math.sin(af * Math.PI / 3) * 10 : 0;
  const legSwing = run ? Math.sin(af * Math.PI / 3) * 8  : 0;

  // Key Y positions
  const headR  = h * 0.095;
  const headY  = y + h * 0.122;
  const shldY  = y + h * 0.265;
  const waistY = y + h * 0.500;
  const hipY   = y + h * 0.575;
  const kneeY  = y + h * 0.740;
  const ankleY = y + h * 0.870;
  const footY  = y + h;
  const bw     = w * 0.46; // body width

  ctx.lineCap = 'round'; ctx.lineJoin = 'round';

  // ── Pigtails (drawn behind head) ─────────────────────────
  ctx.strokeStyle = '#e2e8f0'; ctx.lineWidth = w * 0.13;
  // Left pigtail: arcs up then cascades down past shoulder
  ctx.beginPath();
  ctx.moveTo(cx - headR * 0.5, headY - headR * 0.4);
  ctx.bezierCurveTo(cx - w * 0.65, headY - headR * 3.2,
                    cx - w * 0.75, headY - headR * 1.0,
                    cx - w * 0.52, shldY + (waistY - shldY) * 0.7);
  ctx.stroke();
  // Right pigtail
  ctx.beginPath();
  ctx.moveTo(cx + headR * 0.5, headY - headR * 0.4);
  ctx.bezierCurveTo(cx + w * 0.65, headY - headR * 3.2,
                    cx + w * 0.75, headY - headR * 1.0,
                    cx + w * 0.52, shldY + (waistY - shldY) * 0.7);
  ctx.stroke();
  // Pigtail hair ties (gold ribbon)
  ctx.fillStyle = '#d97706';
  ctx.beginPath(); ctx.arc(cx - headR * 0.5, headY - headR * 0.35, w * 0.04, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx + headR * 0.5, headY - headR * 0.35, w * 0.04, 0, Math.PI * 2); ctx.fill();

  // ── Short cape (behind body) ──────────────────────────────
  ctx.fillStyle = '#f8fafc';
  ctx.beginPath();
  ctx.moveTo(cx - bw * 0.55, shldY);
  ctx.lineTo(cx - bw * 0.45, waistY - (waistY - shldY) * 0.22);
  ctx.lineTo(cx + bw * 0.45, waistY - (waistY - shldY) * 0.22);
  ctx.lineTo(cx + bw * 0.55, shldY);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#d97706'; ctx.lineWidth = w * 0.04; ctx.stroke();
  // Cape shoulder jewels
  const jewR = w * 0.055;
  ctx.fillStyle = '#dc2626';
  ctx.beginPath(); ctx.arc(cx - bw * 0.48, shldY + jewR, jewR, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx + bw * 0.48, shldY + jewR, jewR, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#fca5a5';
  ctx.beginPath(); ctx.arc(cx - bw * 0.50, shldY + jewR * 0.7, jewR * 0.45, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx + bw * 0.46, shldY + jewR * 0.7, jewR * 0.45, 0, Math.PI * 2); ctx.fill();

  // ── Legs (black tights) ───────────────────────────────────
  ctx.strokeStyle = '#1e1b4b'; ctx.lineWidth = w * 0.17;
  ctx.beginPath(); ctx.moveTo(cx - w*0.13, hipY); ctx.lineTo(cx - w*0.11, ankleY + legSwing*0.4); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx + w*0.13, hipY); ctx.lineTo(cx + w*0.11, ankleY - legSwing*0.4); ctx.stroke();
  // Brown boots
  ctx.fillStyle = '#92400e';
  ctx.roundRect(cx - w*0.22, ankleY + legSwing*0.4, w*0.22, footY - ankleY, [3,3,5,5]); ctx.fill();
  ctx.roundRect(cx + w*0.00, ankleY - legSwing*0.4, w*0.22, footY - ankleY, [3,3,5,5]); ctx.fill();
  ctx.fillStyle = '#a16207';
  ctx.fillRect(cx - w*0.20, ankleY + legSwing*0.4 + 1, w*0.04, footY - ankleY - 2);
  ctx.fillRect(cx + w*0.02, ankleY - legSwing*0.4 + 1, w*0.04, footY - ankleY - 2);

  // ── Arms & Bow ────────────────────────────────────────────────
  // bowCX: bow's x position (always left side); bowH_sz: bow height (torso+)
  const bowCX   = cx - bw * 0.64;
  const bowH_sz = kneeY - shldY + h * 0.06; // big visible bow

  // lHandX/Y, rHandX/Y used again after the body for cuff drawing
  let lHandX, lHandY, rHandX, rHandY;

  if (aiming) {
    // Raise bow to shoulder height; arrow nocked pointing right
    const bowMY = shldY + (waistY - shldY) * 0.28;
    const pullX  = bowCX + w * 0.26; // string pulled toward body
    lHandX = bowCX + w*0.03; lHandY = bowMY;
    rHandX = pullX;          rHandY = bowMY;

    // Left arm: reaches to bow grip
    ctx.strokeStyle = '#fde68a'; ctx.lineWidth = w * 0.13;
    ctx.beginPath();
    ctx.moveTo(cx - bw*0.4, shldY + (waistY-shldY)*0.08);
    ctx.lineTo(lHandX, lHandY);
    ctx.stroke();
    // Right arm: pulls string
    ctx.beginPath();
    ctx.moveTo(cx + bw*0.4, shldY + (waistY-shldY)*0.08);
    ctx.lineTo(rHandX, rHandY);
    ctx.stroke();

    // Bow body (tall dark arc)
    ctx.strokeStyle = '#5c2d0a'; ctx.lineWidth = w * 0.082;
    ctx.beginPath();
    ctx.moveTo(bowCX, bowMY - bowH_sz*0.5);
    ctx.bezierCurveTo(bowCX - w*0.24, bowMY - bowH_sz*0.58,
                      bowCX - w*0.24, bowMY + bowH_sz*0.58,
                      bowCX, bowMY + bowH_sz*0.5);
    ctx.stroke();
    // Wood highlight
    ctx.strokeStyle = '#a16207'; ctx.lineWidth = w * 0.03;
    ctx.beginPath();
    ctx.moveTo(bowCX - w*0.01, bowMY - bowH_sz*0.3);
    ctx.bezierCurveTo(bowCX - w*0.11, bowMY - bowH_sz*0.3,
                      bowCX - w*0.11, bowMY + bowH_sz*0.3,
                      bowCX - w*0.01, bowMY + bowH_sz*0.3);
    ctx.stroke();
    // String (pulled back)
    ctx.strokeStyle = '#fef3c7'; ctx.lineWidth = w * 0.025;
    ctx.beginPath();
    ctx.moveTo(bowCX, bowMY - bowH_sz*0.5);
    ctx.lineTo(pullX, bowMY);
    ctx.lineTo(bowCX, bowMY + bowH_sz*0.5);
    ctx.stroke();
    // Ice arrow nocked, pointing right
    const arrowTip = cx + bw * 0.6;
    ctx.strokeStyle = '#bae6fd'; ctx.lineWidth = w * 0.05;
    ctx.beginPath(); ctx.moveTo(pullX, bowMY); ctx.lineTo(arrowTip, bowMY); ctx.stroke();
    ctx.fillStyle = '#38bdf8';
    ctx.beginPath();
    ctx.moveTo(arrowTip + w*0.09, bowMY);
    ctx.lineTo(arrowTip, bowMY - w*0.058);
    ctx.lineTo(arrowTip, bowMY + w*0.058);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.beginPath(); ctx.arc(arrowTip + w*0.04, bowMY - w*0.025, w*0.025, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#c7d2fe'; ctx.lineWidth = w * 0.035;
    ctx.beginPath(); ctx.moveTo(pullX + w*0.02, bowMY); ctx.lineTo(pullX - w*0.08, bowMY - w*0.07); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(pullX + w*0.02, bowMY); ctx.lineTo(pullX - w*0.08, bowMY + w*0.07); ctx.stroke();

  } else {
    // Resting: bow at left side, tip pointing down
    const bowMY = shldY + (kneeY - shldY) * 0.52;
    lHandX = bowCX + w*0.03; lHandY = bowMY - bowH_sz*0.1;
    rHandX = cx + bw*0.38;   rHandY = waistY - armSwing*0.25;

    // Left arm: hanging, gripping bow
    ctx.strokeStyle = '#fde68a'; ctx.lineWidth = w * 0.13;
    ctx.beginPath();
    ctx.moveTo(cx - bw*0.4, shldY + (waistY-shldY)*0.08);
    ctx.lineTo(lHandX, lHandY);
    ctx.stroke();
    // Right arm: relaxed
    ctx.beginPath();
    ctx.moveTo(cx + bw*0.45, shldY + (waistY-shldY)*0.1);
    ctx.bezierCurveTo(cx + bw*0.55, shldY + (waistY-shldY)*0.35 - armSwing*0.3,
                      cx + bw*0.52, waistY - (waistY-shldY)*0.3,
                      rHandX, rHandY);
    ctx.stroke();

    // Bow body (tall dark arc, vertical)
    ctx.strokeStyle = '#5c2d0a'; ctx.lineWidth = w * 0.082;
    ctx.beginPath();
    ctx.moveTo(bowCX, bowMY - bowH_sz*0.5);
    ctx.bezierCurveTo(bowCX - w*0.24, bowMY - bowH_sz*0.58,
                      bowCX - w*0.24, bowMY + bowH_sz*0.58,
                      bowCX, bowMY + bowH_sz*0.5);
    ctx.stroke();
    // Wood highlight
    ctx.strokeStyle = '#a16207'; ctx.lineWidth = w * 0.03;
    ctx.beginPath();
    ctx.moveTo(bowCX - w*0.01, bowMY - bowH_sz*0.3);
    ctx.bezierCurveTo(bowCX - w*0.11, bowMY - bowH_sz*0.3,
                      bowCX - w*0.11, bowMY + bowH_sz*0.3,
                      bowCX - w*0.01, bowMY + bowH_sz*0.3);
    ctx.stroke();
    // String (resting, slightly curved)
    ctx.strokeStyle = '#fef3c7'; ctx.lineWidth = w * 0.025;
    ctx.beginPath();
    ctx.moveTo(bowCX, bowMY - bowH_sz*0.5);
    ctx.lineTo(bowCX + w*0.04, bowMY);
    ctx.lineTo(bowCX, bowMY + bowH_sz*0.5);
    ctx.stroke();
  }

  // ── Body — jacket over striped shirt ─────────────────────
  // Striped shirt (center strip)
  const sW = bw * 0.38, sX = cx - sW / 2;
  const strH = (waistY - shldY) / 6;
  for (let i = 0; i < 6; i++) {
    ctx.fillStyle = i % 2 === 0 ? '#1f2937' : '#ffffff';
    ctx.fillRect(sX, shldY + i * strH, sW, strH);
  }
  // White jacket (sides over stripes)
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(cx - bw*0.5, shldY, bw*0.28, waistY - shldY);
  ctx.fillRect(cx + bw*0.22, shldY, bw*0.28, waistY - shldY);
  // Jacket lapel lines (gold)
  ctx.strokeStyle = '#d97706'; ctx.lineWidth = w * 0.04;
  ctx.beginPath(); ctx.moveTo(cx - bw*0.1, shldY); ctx.lineTo(cx - bw*0.28, waistY - (waistY-shldY)*0.3); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx + bw*0.1, shldY); ctx.lineTo(cx + bw*0.28, waistY - (waistY-shldY)*0.3); ctx.stroke();
  // Gold jacket outline
  ctx.strokeStyle = '#d97706'; ctx.lineWidth = w * 0.03;
  ctx.strokeRect(cx - bw*0.5, shldY, bw, waistY - shldY);
  // Gold cuffs (drawn after body so they appear on top)
  ctx.fillStyle = '#d97706';
  const cuffR = w * 0.09;
  ctx.beginPath(); ctx.arc(lHandX, lHandY, cuffR, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(rHandX, rHandY, cuffR, 0, Math.PI*2); ctx.fill();
  // Black belt
  ctx.fillStyle = '#111827';
  ctx.roundRect(cx - bw*0.52, waistY - h*0.03, bw*1.04, h*0.06, h*0.02); ctx.fill();
  ctx.fillStyle = '#d97706';
  ctx.roundRect(cx - w*0.06, waistY - h*0.025, w*0.12, h*0.05, h*0.015); ctx.fill();
  // White skirt
  ctx.fillStyle = '#f8fafc';
  ctx.beginPath();
  ctx.moveTo(cx - bw*0.52, hipY);
  ctx.lineTo(cx - bw*0.65, kneeY - (kneeY-hipY)*0.08);
  ctx.lineTo(cx + bw*0.65, kneeY - (kneeY-hipY)*0.08);
  ctx.lineTo(cx + bw*0.52, hipY);
  ctx.closePath(); ctx.fill();
  // Gold skirt hem
  ctx.strokeStyle = '#d97706'; ctx.lineWidth = w * 0.045;
  ctx.beginPath();
  ctx.moveTo(cx - bw*0.65, kneeY - (kneeY-hipY)*0.08);
  ctx.lineTo(cx + bw*0.65, kneeY - (kneeY-hipY)*0.08); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx - bw*0.52, hipY); ctx.lineTo(cx - bw*0.65, kneeY - (kneeY-hipY)*0.08); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx + bw*0.52, hipY); ctx.lineTo(cx + bw*0.65, kneeY - (kneeY-hipY)*0.08); ctx.stroke();

  // ── Large pointed elf ears ────────────────────────────────
  ctx.fillStyle = '#fde68a';
  ctx.beginPath();
  ctx.moveTo(cx - headR*0.82, headY - headR*0.1);
  ctx.lineTo(cx - headR*2.6,  headY - headR*0.9);
  ctx.lineTo(cx - headR*0.88, headY + headR*0.45);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#f59e0b'; ctx.lineWidth = w*0.025; ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(cx + headR*0.82, headY - headR*0.1);
  ctx.lineTo(cx + headR*2.6,  headY - headR*0.9);
  ctx.lineTo(cx + headR*0.88, headY + headR*0.45);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#f59e0b'; ctx.lineWidth = w*0.025; ctx.stroke();

  // ── Head ──────────────────────────────────────────────────
  ctx.fillStyle = '#fde68a';
  ctx.beginPath(); ctx.ellipse(cx, headY, headR*0.86, headR, 0, 0, Math.PI*2); ctx.fill();

  // ── Hair top (white, center-parted) ──────────────────────
  ctx.fillStyle = '#e2e8f0';
  ctx.beginPath(); ctx.arc(cx, headY - headR*0.12, headR*0.9, Math.PI, 0); ctx.fill();
  ctx.strokeStyle = '#cbd5e1'; ctx.lineWidth = w*0.025;
  ctx.beginPath(); ctx.moveTo(cx, headY - headR*0.9); ctx.lineTo(cx, headY - headR*0.2); ctx.stroke();

  // ── Face ──────────────────────────────────────────────────
  // Green eyes
  const eyeR = headR * 0.27;
  [cx - headR*0.38, cx + headR*0.38].forEach((ex, i) => {
    ctx.fillStyle = '#166534';
    ctx.beginPath(); ctx.ellipse(ex, headY + headR*0.06, eyeR*0.85, eyeR, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#4ade80';
    ctx.beginPath(); ctx.ellipse(ex, headY + headR*0.03, eyeR*0.55, eyeR*0.65, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#052e16';
    ctx.beginPath(); ctx.ellipse(ex, headY + headR*0.05, eyeR*0.32, eyeR*0.38, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(ex + eyeR*0.3, headY - headR*0.04, eyeR*0.22, 0, Math.PI*2); ctx.fill();
  });
  // Subtle smile
  ctx.strokeStyle = '#92400e'; ctx.lineWidth = headR*0.14; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(cx, headY + headR*0.52, headR*0.28, 0.25, Math.PI-0.25); ctx.stroke();
  // Rosy cheeks
  ctx.fillStyle = 'rgba(251,113,133,0.25)';
  ctx.beginPath(); ctx.ellipse(cx - headR*0.65, headY + headR*0.35, headR*0.35, headR*0.22, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx + headR*0.65, headY + headR*0.35, headR*0.35, headR*0.22, 0, 0, Math.PI*2); ctx.fill();
}

function drawParkerSprite(x, y, w, h, state, animFrame, wingPhase) {
  const cx = x + w / 2;
  const af = animFrame  || 0;
  const wp = wingPhase  || 0;
  const run = state === 'run';
  const inAir = state === 'jump' || state === 'fall';
  const armSwing = run ? Math.sin(af * Math.PI / 3) * 10 : 0;
  const legSwing = run ? Math.sin(af * Math.PI / 3) * 8  : 0;
  const flapAmt  = inAir ? Math.sin(wp * 3) * 7 : Math.sin(wp) * 3;

  const headR  = h * 0.095;
  const headY  = y + h * 0.122;
  const shldY  = y + h * 0.265;
  const waistY = y + h * 0.500;
  const hemY   = y + h * 0.790;
  const ankleY = y + h * 0.870;
  const footY  = y + h;
  const bw     = w * 0.46;

  ctx.lineCap = 'round'; ctx.lineJoin = 'round';

  // ── Dragonfly wings (drawn behind body) ───────────────────
  const wingCY = shldY + (waistY - shldY) * 0.3;
  // Helper: draw one iridescent wing
  function drawWing(wCx, wCy, rx, ry, angle, colors) {
    ctx.save();
    ctx.translate(wCx, wCy);
    ctx.rotate(angle);
    // Multi-layer for iridescence
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, rx);
    g.addColorStop(0,   colors[0]);
    g.addColorStop(0.5, colors[1]);
    g.addColorStop(1,   colors[2]);
    ctx.fillStyle = g;
    ctx.globalAlpha = 0.72;
    ctx.beginPath(); ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI*2); ctx.fill();
    // Shimmer overlay
    ctx.fillStyle = 'rgba(255,255,255,0.28)';
    ctx.beginPath(); ctx.ellipse(-rx*0.2, -ry*0.25, rx*0.35, ry*0.3, 0, 0, Math.PI*2); ctx.fill();
    // Wing vein
    ctx.strokeStyle = 'rgba(255,255,255,0.45)'; ctx.lineWidth = 0.8;
    ctx.globalAlpha = 0.6;
    ctx.beginPath(); ctx.moveTo(-rx, 0); ctx.lineTo(rx*0.8, 0); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, -ry); ctx.lineTo(0, ry*0.8); ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.restore();
  }
  const wingW = w * 0.62, wingH = h * 0.14;
  // Upper left wing
  drawWing(cx - w*0.1, wingCY - flapAmt, wingW, wingH, -0.38,
    ['rgba(96,165,250,0.9)','rgba(167,139,250,0.85)','rgba(45,212,191,0.6)']);
  // Upper right wing
  drawWing(cx + w*0.1, wingCY - flapAmt, wingW, wingH, 0.38,
    ['rgba(167,139,250,0.9)','rgba(45,212,191,0.85)','rgba(96,165,250,0.6)']);
  // Lower left wing
  drawWing(cx - w*0.06, wingCY + h*0.08 + flapAmt*0.4, wingW*0.72, wingH*0.72, 0.22,
    ['rgba(45,212,191,0.8)','rgba(96,165,250,0.75)','rgba(167,139,250,0.5)']);
  // Lower right wing
  drawWing(cx + w*0.06, wingCY + h*0.08 + flapAmt*0.4, wingW*0.72, wingH*0.72, -0.22,
    ['rgba(167,139,250,0.8)','rgba(45,212,191,0.75)','rgba(96,165,250,0.5)']);

  // ── Hair (long blonde, behind head) ──────────────────────
  ctx.strokeStyle = '#fbbf24'; ctx.lineWidth = w * 0.15;
  ctx.beginPath();
  ctx.moveTo(cx - headR*0.3, headY + headR*0.5);
  ctx.bezierCurveTo(cx - w*0.45, shldY + (waistY-shldY)*0.3,
                    cx - w*0.5,  waistY,
                    cx - w*0.4,  waistY + (hemY-waistY)*0.5);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(cx + headR*0.3, headY + headR*0.5);
  ctx.bezierCurveTo(cx + w*0.42, shldY + (waistY-shldY)*0.3,
                    cx + w*0.48, waistY,
                    cx + w*0.38, waistY + (hemY-waistY)*0.5);
  ctx.stroke();

  // ── Legs ──────────────────────────────────────────────────
  ctx.strokeStyle = '#fde68a'; ctx.lineWidth = w * 0.15;
  ctx.beginPath(); ctx.moveTo(cx - w*0.13, hemY); ctx.lineTo(cx - w*0.11, ankleY + legSwing*0.4); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx + w*0.13, hemY); ctx.lineTo(cx + w*0.11, ankleY - legSwing*0.4); ctx.stroke();
  // Fairy slippers
  ctx.fillStyle = '#f0abfc';
  ctx.beginPath(); ctx.ellipse(cx - w*0.13, ankleY + legSwing*0.4 + (footY-ankleY)*0.5, w*0.12, (footY-ankleY)*0.45, 0.15, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx + w*0.13, ankleY - legSwing*0.4 + (footY-ankleY)*0.5, w*0.12, (footY-ankleY)*0.45, -0.15, 0, Math.PI*2); ctx.fill();

  // ── Rainbow tie-dye dress ─────────────────────────────────
  const dressColors = ['#ef4444','#f97316','#facc15','#4ade80','#38bdf8','#818cf8','#e879f9'];
  const dressH = hemY - shldY;
  dressColors.forEach((col, i) => {
    const bandY = shldY + (i / dressColors.length) * dressH;
    const nextY = shldY + ((i + 1) / dressColors.length) * dressH;
    const spreadL = bw * 0.52 + (i / dressColors.length) * bw * 0.35;
    const spreadR = bw * 0.52 + ((i+1) / dressColors.length) * bw * 0.35;
    ctx.fillStyle = col;
    ctx.globalAlpha = 0.82;
    ctx.beginPath();
    ctx.moveTo(cx - spreadL, bandY);
    ctx.lineTo(cx - spreadR, nextY);
    ctx.lineTo(cx + spreadR, nextY);
    ctx.lineTo(cx + spreadL, bandY);
    ctx.closePath(); ctx.fill();
  });
  ctx.globalAlpha = 1;
  // Dress hem curve
  ctx.fillStyle = '#e879f9'; ctx.globalAlpha = 0.6;
  ctx.beginPath();
  ctx.ellipse(cx, hemY, bw * 0.87, h * 0.04, 0, 0, Math.PI * 2);
  ctx.fill(); ctx.globalAlpha = 1;
  // Swirly tie-dye lines
  ctx.globalAlpha = 0.35;
  ['#fff','#fde68a','#a5f3fc'].forEach((col, i) => {
    ctx.strokeStyle = col; ctx.lineWidth = w * 0.03;
    ctx.beginPath();
    ctx.moveTo(cx + bw * 0.1, shldY + dressH * (i * 0.28));
    ctx.bezierCurveTo(cx - bw*0.3, shldY + dressH*(i*0.28+0.12),
                      cx + bw*0.3, shldY + dressH*(i*0.28+0.22),
                      cx - bw*0.1, shldY + dressH*(i*0.28+0.32));
    ctx.stroke();
  });
  ctx.globalAlpha = 1;

  // ── Arms ──────────────────────────────────────────────────
  ctx.strokeStyle = '#fde68a'; ctx.lineWidth = w * 0.12;
  // Left arm
  ctx.beginPath();
  ctx.moveTo(cx - bw*0.5, shldY + (waistY-shldY)*0.1);
  ctx.bezierCurveTo(cx - bw*0.65, shldY + (waistY-shldY)*0.45 + armSwing*0.3,
                    cx - bw*0.6,  waistY - (waistY-shldY)*0.15,
                    cx - bw*0.52, waistY + armSwing*0.22);
  ctx.stroke();
  // Right arm (holds wand)
  ctx.beginPath();
  ctx.moveTo(cx + bw*0.5, shldY + (waistY-shldY)*0.1);
  ctx.bezierCurveTo(cx + bw*0.62, shldY + (waistY-shldY)*0.38 - armSwing*0.3,
                    cx + bw*0.58, waistY - (waistY-shldY)*0.22,
                    cx + bw*0.5,  waistY - armSwing*0.22);
  ctx.stroke();

  // ── Magic wand ────────────────────────────────────────────
  const wandBaseX = cx + bw * 0.5, wandBaseY = waistY - armSwing * 0.22;
  const wandLen = h * 0.28;
  const wandAngle = -0.6; // tilted up-right
  const wandTipX = wandBaseX + Math.cos(wandAngle) * wandLen;
  const wandTipY = wandBaseY + Math.sin(wandAngle) * wandLen;
  // Wand shaft (gradient)
  const wg = ctx.createLinearGradient(wandBaseX, wandBaseY, wandTipX, wandTipY);
  wg.addColorStop(0, '#78350f'); wg.addColorStop(1, '#c084fc');
  ctx.strokeStyle = wg; ctx.lineWidth = w * 0.055;
  ctx.beginPath(); ctx.moveTo(wandBaseX, wandBaseY); ctx.lineTo(wandTipX, wandTipY); ctx.stroke();
  // Wand glow
  ctx.fillStyle = 'rgba(196,132,252,0.3)';
  ctx.beginPath(); ctx.arc(wandTipX, wandTipY, w*0.18, 0, Math.PI*2); ctx.fill();
  // Wand star tip
  drawStar(ctx, wandTipX, wandTipY, w * 0.12, 5, '#fbbf24');
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(wandTipX, wandTipY, w*0.04, 0, Math.PI*2); ctx.fill();
  // Fairy dust sparkles around star
  const t2 = Date.now() * 0.003;
  ['#f0abfc','#fbbf24','#a5f3fc'].forEach((col, i) => {
    const sa = t2 + i * 2.1;
    ctx.fillStyle = col; ctx.globalAlpha = 0.7 + Math.sin(t2*2+i)*0.3;
    ctx.beginPath();
    ctx.arc(wandTipX + Math.cos(sa)*w*0.15, wandTipY + Math.sin(sa)*w*0.15, w*0.025, 0, Math.PI*2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;

  // ── Head ──────────────────────────────────────────────────
  ctx.fillStyle = '#fed7aa';
  ctx.beginPath(); ctx.ellipse(cx, headY, headR*0.86, headR, 0, 0, Math.PI*2); ctx.fill();

  // ── Hair top (blonde) ─────────────────────────────────────
  ctx.fillStyle = '#fbbf24';
  ctx.beginPath(); ctx.arc(cx, headY - headR*0.12, headR*0.9, Math.PI, 0); ctx.fill();
  // Side waves
  ctx.beginPath(); ctx.ellipse(cx - headR*0.6, headY + headR*0.2, headR*0.35, headR*0.5, -0.3, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx + headR*0.6, headY + headR*0.2, headR*0.35, headR*0.5, 0.3, 0, Math.PI*2); ctx.fill();

  // ── Face ──────────────────────────────────────────────────
  // Blue eyes with lashes
  const eyeR = headR * 0.27;
  [cx - headR*0.37, cx + headR*0.37].forEach((ex) => {
    ctx.fillStyle = '#1e3a5f';
    ctx.beginPath(); ctx.ellipse(ex, headY + headR*0.06, eyeR*0.85, eyeR, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#60a5fa';
    ctx.beginPath(); ctx.ellipse(ex, headY + headR*0.03, eyeR*0.55, eyeR*0.65, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#1e3a5f';
    ctx.beginPath(); ctx.ellipse(ex, headY + headR*0.05, eyeR*0.32, eyeR*0.38, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(ex + eyeR*0.3, headY - headR*0.04, eyeR*0.22, 0, Math.PI*2); ctx.fill();
    // Lashes
    ctx.strokeStyle = '#1e3a5f'; ctx.lineWidth = headR * 0.1;
    for (let le = -1; le <= 1; le++) {
      ctx.beginPath();
      ctx.moveTo(ex + le*eyeR*0.5, headY - headR*0.09);
      ctx.lineTo(ex + le*eyeR*0.6, headY - headR*0.26);
      ctx.stroke();
    }
  });
  // Smile
  ctx.strokeStyle = '#9a3412'; ctx.lineWidth = headR*0.14;
  ctx.beginPath(); ctx.arc(cx, headY + headR*0.52, headR*0.28, 0.25, Math.PI-0.25); ctx.stroke();
  // Rosy cheeks
  ctx.fillStyle = 'rgba(244,114,182,0.3)';
  ctx.beginPath(); ctx.ellipse(cx - headR*0.65, headY + headR*0.35, headR*0.35, headR*0.22, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx + headR*0.65, headY + headR*0.35, headR*0.35, headR*0.22, 0, 0, Math.PI*2); ctx.fill();
}

const projectiles = [];

class Projectile {
  constructor(x, y, vx, type) {
    this.x = x; this.y = y; this.vx = vx; this.vy = 0;
    this.type = type; // 'ice' | 'vine'
    this.active = true;
    this.age = 0;
    this.w = type === 'ice' ? 30 : 24;
    this.h = type === 'ice' ? 9  : 13;
  }

  update() {
    this.x += this.vx;
    this.age++;
    if (this.x < Camera.x - 120 || this.x > Camera.x + Camera.W + 120) this.active = false;
  }

  draw() {
    if (!Camera.inView(this.x - this.w, this.y - this.h, this.w*2, this.h*2)) return;
    const { x: sx, y: sy } = Camera.toScreen(this.x, this.y);
    ctx.save();
    if (this.vx < 0) { ctx.translate(sx, sy); ctx.scale(-1, 1); this._draw(0, 0); }
    else              { this._draw(sx, sy); }
    ctx.restore();
  }

  _draw(sx, sy) {
    this.type === 'ice' ? this._drawIce(sx, sy) : this._drawVine(sx, sy);
  }

  _drawIce(sx, sy) {
    const { w, h } = this;
    // Shaft
    const sg = ctx.createLinearGradient(sx, sy, sx + w, sy);
    sg.addColorStop(0, '#e0f2fe'); sg.addColorStop(1, '#7dd3fc');
    ctx.fillStyle = sg;
    ctx.roundRect(sx, sy - h*0.28, w - 9, h*0.55, 2); ctx.fill();
    // Crystal facet
    ctx.fillStyle = 'rgba(186,230,253,0.55)';
    ctx.beginPath(); ctx.moveTo(sx+w*0.28, sy-h*0.5); ctx.lineTo(sx+w*0.48, sy+h*0.5); ctx.lineTo(sx+w*0.38, sy); ctx.closePath(); ctx.fill();
    // Arrowhead
    ctx.fillStyle = '#38bdf8';
    ctx.beginPath(); ctx.moveTo(sx+w, sy); ctx.lineTo(sx+w-10, sy-h*0.5); ctx.lineTo(sx+w-8, sy); ctx.lineTo(sx+w-10, sy+h*0.5); ctx.closePath(); ctx.fill();
    // Shimmer
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.beginPath(); ctx.arc(sx+w-13, sy, 2, 0, Math.PI*2); ctx.fill();
    // Ice sparkles
    const t = this.age * 0.18;
    ['rgba(186,230,253,0.8)','rgba(255,255,255,0.6)'].forEach((col, i) => {
      ctx.fillStyle = col;
      ctx.beginPath(); ctx.arc(sx+w*0.25+i*w*0.28, sy+Math.sin(t+i)*h*0.7-h*0.6, 1.5, 0, Math.PI*2); ctx.fill();
    });
    // Fletching
    ctx.strokeStyle = '#c7d2fe'; ctx.lineWidth = 1.5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(sx+3, sy); ctx.lineTo(sx-5, sy-h*0.55); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(sx+3, sy); ctx.lineTo(sx-5, sy+h*0.55); ctx.stroke();
  }

  _drawVine(sx, sy) {
    const { w, h, age } = this;
    // Wavy vine stem
    ctx.strokeStyle = '#166534'; ctx.lineWidth = 3.5; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(sx, sy);
    for (let i = 0; i <= w; i += 3) {
      ctx.lineTo(sx + i, sy + Math.sin(i * 0.28 + age * 0.14) * 4.5);
    }
    ctx.stroke();
    // Inner vine
    ctx.strokeStyle = '#14532d'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(sx, sy);
    for (let i = 0; i <= w; i += 3) {
      ctx.lineTo(sx + i, sy + Math.sin(i * 0.28 + age * 0.14) * 4.5);
    }
    ctx.stroke();
    // Thorns
    ctx.strokeStyle = '#15803d'; ctx.lineWidth = 1.8;
    for (let i = 7; i < w - 4; i += 10) {
      const vy = sy + Math.sin(i * 0.28 + age * 0.14) * 4.5;
      ctx.beginPath(); ctx.moveTo(sx+i, vy); ctx.lineTo(sx+i+3, vy-7); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(sx+i, vy); ctx.lineTo(sx+i-2, vy+6); ctx.stroke();
    }
    // Leaf tip
    ctx.fillStyle = '#15803d';
    const tipVY = sy + Math.sin(w * 0.28 + age * 0.14) * 4.5;
    ctx.beginPath(); ctx.ellipse(sx+w+4, tipVY, 7, 3.5, 0.3, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#052e16'; ctx.lineWidth = 0.8;
    ctx.beginPath(); ctx.moveTo(sx+w, tipVY); ctx.lineTo(sx+w+8, tipVY); ctx.stroke();
  }
}

// ── Shoot action — creates real projectiles ───────────────────
function shootAction(player) {
  const type = player.character === 'penelope' ? 'ice' : 'vine';
  if (player.character === 'penelope') player.shootTimer = 15;
  const ox = player.x + (player.facingRight ? player.w + 4 : -4);
  // Penelope's arrow launches from shoulder height (raised bow); others from mid-body
  const oy = player.y + (player.character === 'penelope' ? player.h * 0.30 : player.h * 0.42);
  const vx = player.facingRight ? 11 : -11;
  projectiles.push(new Projectile(ox, oy, vx, type));
  Particles.spawn(ox, oy, {
    count: 4,
    color: type === 'ice' ? '#bae6fd' : '#4ade80',
    size: 3, spread: 2, rise: 1, decay: 0.07,
  });
}

// ═══════════════════════════════════════════════════════════════
//  PLATFORM
// ═══════════════════════════════════════════════════════════════
class Platform {
  // style: 'island' | 'cloud' | 'thin'
  constructor(x, y, w, h, style = 'island') {
    this.x = x; this.y = y; this.w = w; this.h = h;
    this.style = style;
    this._seed = x * 0.01 + y * 0.003;  // deterministic decoration seed
  }

  // Shared AABB overlap check used by Player
  overlaps(px, py, pw, ph) {
    return px < this.x + this.w && px + pw > this.x &&
           py < this.y + this.h && py + ph > this.y;
  }

  draw() {
    if (!Camera.inView(this.x, this.y, this.w, this.h)) return;
    const { x, y } = Camera.toScreen(this.x, this.y);
    if      (this.style === 'island') this._drawIsland(x, y);
    else if (this.style === 'cloud')  this._drawCloud(x, y);
    else if (this.style === 'ground') this._drawGround(x, y);
    else                               this._drawThin(x, y);
  }

  _drawIsland(sx, sy) {
    const { w, h } = this;

    // Dangling roots
    ctx.strokeStyle = '#78350f';
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    let rx = sx + 12;
    let ri = 0;
    while (rx < sx + w - 12) {
      const rl = 14 + ((this._seed * 100 + ri * 17) % 18);
      ctx.beginPath();
      ctx.moveTo(rx, sy + h);
      ctx.bezierCurveTo(rx - 4, sy + h + rl * 0.5, rx + 4, sy + h + rl * 0.7, rx, sy + h + rl);
      ctx.stroke();
      rx += 18 + ((ri * 7) % 9);
      ri++;
    }

    // Dirt body
    ctx.fillStyle = '#a16207';
    ctx.roundRect(sx, sy + 14, w, h - 14, [0, 0, 6, 6]);
    ctx.fill();

    // Soil stripe
    ctx.fillStyle = '#92400e';
    ctx.fillRect(sx, sy + 14, w, 6);

    // Grass top
    const gGrad = ctx.createLinearGradient(sx, sy, sx, sy + 18);
    gGrad.addColorStop(0, '#a3e635');
    gGrad.addColorStop(1, '#4ade80');
    ctx.fillStyle = gGrad;
    ctx.roundRect(sx, sy + 2, w, 16, 7);
    ctx.fill();

    // Grass bumps
    ctx.fillStyle = '#86efac';
    for (let bx = sx + 8; bx < sx + w - 8; bx += 16) {
      ctx.beginPath();
      ctx.arc(bx, sy + 5, 7, Math.PI, 0);
      ctx.fill();
    }

    // Decorations: flowers & mushrooms
    const decCount = Math.max(1, Math.floor(w / 90));
    for (let i = 0; i < decCount; i++) {
      const seed2 = this._seed * 1000 + i * 37;
      const fx = sx + 28 + i * Math.floor((w - 56) / Math.max(decCount, 1))
               + (seed2 % 20) - 10;
      if ((Math.floor(seed2) % 2) === 0) {
        // Flower
        const petal = ['#f87171','#fb923c','#facc15','#a78bfa','#f9a8d4'][Math.floor(seed2) % 5];
        for (let p = 0; p < 5; p++) {
          ctx.fillStyle = petal;
          const pa = (p / 5) * Math.PI * 2;
          ctx.beginPath();
          ctx.arc(fx + Math.cos(pa) * 4, sy + Math.sin(pa) * 3, 3, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.fillStyle = '#fef08a';
        ctx.beginPath(); ctx.arc(fx, sy, 3.5, 0, Math.PI * 2); ctx.fill();
      } else {
        // Mushroom
        ctx.fillStyle = '#ef4444';
        ctx.beginPath(); ctx.arc(fx, sy - 2, 5.5, Math.PI, 0); ctx.fill();
        ctx.fillStyle = '#991b1b';
        ctx.fillRect(fx - 2.5, sy - 2, 5, 7);
        ctx.fillStyle = 'rgba(255,255,255,0.9)';
        ctx.beginPath(); ctx.arc(fx - 2, sy - 4, 1.5, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(fx + 2, sy - 2, 1, 0, Math.PI * 2); ctx.fill();
      }
    }
  }

  _drawCloud(sx, sy) {
    const { w, h } = this;
    const cx = sx + w / 2;
    const cy = sy + h * 0.45;
    const r  = h * 0.55;

    ctx.fillStyle = 'rgba(255,255,255,0.92)';
    // Bottom fill (solid rectangle base so character stands on flat surface)
    ctx.fillRect(sx, cy, w, h - (cy - sy));

    // Puff circles
    const puffs = [
      [cx,         cy, r * 1.15],
      [cx - w * 0.27, cy + 2, r * 0.9],
      [cx + w * 0.27, cy + 2, r * 0.9],
      [cx - w * 0.12, cy - r * 0.45, r * 0.75],
      [cx + w * 0.14, cy - r * 0.38, r * 0.65],
    ];
    for (const [px, py, pr] of puffs) {
      ctx.beginPath();
      ctx.arc(px, py, pr, 0, Math.PI * 2);
      ctx.fill();
    }

    // Sheen
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.beginPath();
    ctx.arc(cx - w * 0.12, cy - r * 0.4, r * 0.32, 0, Math.PI * 2);
    ctx.fill();
  }

  _drawThin(sx, sy) {
    // Thin magical platform (glowing crystal)
    const grad = ctx.createLinearGradient(sx, sy, sx + this.w, sy);
    grad.addColorStop(0,   '#6d28d9');
    grad.addColorStop(0.5, '#a78bfa');
    grad.addColorStop(1,   '#6d28d9');
    ctx.fillStyle = grad;
    ctx.roundRect(sx, sy, this.w, this.h, 5);
    ctx.fill();
    ctx.strokeStyle = '#c4b5fd';
    ctx.lineWidth = 1.5;
    ctx.roundRect(sx, sy, this.w, this.h, 5);
    ctx.stroke();
  }

  _drawGround(sx, sy) {
    // Only paint the visible strip (ground spans the full world width)
    const drawX = Math.max(sx, 0);
    const drawW = Math.min(sx + this.w, canvas.width) - drawX;
    if (drawW <= 0) return;

    // Dirt body
    const dg = ctx.createLinearGradient(drawX, sy + 16, drawX, sy + this.h);
    dg.addColorStop(0,   '#a16207');
    dg.addColorStop(0.3, '#92400e');
    dg.addColorStop(1,   '#7c2d12');
    ctx.fillStyle = dg;
    ctx.fillRect(drawX, sy + 16, drawW, this.h - 16);

    // Grass strip
    const gg = ctx.createLinearGradient(drawX, sy, drawX, sy + 16);
    gg.addColorStop(0, '#4ade80');
    gg.addColorStop(1, '#16a34a');
    ctx.fillStyle = gg;
    ctx.fillRect(drawX, sy, drawW, 16);

    // Rounded grass tufts along top edge
    ctx.fillStyle = '#22c55e';
    for (let tx = (drawX - sx) % 28 + drawX; tx < drawX + drawW; tx += 28) {
      ctx.beginPath(); ctx.arc(tx, sy + 4, 6, Math.PI, 0); ctx.fill();
    }

    // Dirt specks (deterministic from world position)
    ctx.fillStyle = 'rgba(100,38,0,0.35)';
    for (let i = 0; i < 30; i++) {
      const wx = drawX + Camera.x + (i * 317 + 7) % drawW;
      const wy = sy + 20 + (i * 173 % (this.h - 24));
      const { x: spx } = Camera.toScreen(wx, 0);
      if (spx >= drawX && spx <= drawX + drawW) {
        ctx.beginPath(); ctx.arc(spx, wy, 2.5, 0, Math.PI * 2); ctx.fill();
      }
    }

    // Small stones
    ctx.fillStyle = '#78716c';
    for (let i = 0; i < 12; i++) {
      const wx = drawX + Camera.x + (i * 613 + 11) % drawW;
      const wy = sy + 24 + (i * 251 % (this.h - 30));
      const { x: spx } = Camera.toScreen(wx, 0);
      if (spx >= drawX && spx <= drawX + drawW) {
        ctx.beginPath(); ctx.ellipse(spx, wy, 5.5, 3, 0.4, 0, Math.PI * 2); ctx.fill();
      }
    }
  }
}

// ═══════════════════════════════════════════════════════════════
//  PLAYER
//  character: 'penelope' | 'parker'
//  Future: add health, mana, collectibles, shooting here
// ═══════════════════════════════════════════════════════════════
class Player {
  constructor(x, y, character = 'penelope') {
    this.x = x; this.y = y;
    this.w = 26; this.h = 52;
    this.vx = 0; this.vy = 0;
    this.character = character;
    this.onGround = false;
    this.facingRight = true;
    this.state = 'idle';
    this.animFrame = 0;
    this.animTick  = 0;
    this.wingPhase = 0;
    this.dustTimer = 0;
    this.shootTimer = 0;
    // Double jump
    this.airJumps = 0;        // 0 = air jump available, 1 = used
    // Hearts & damage
    this.hearts      = CFG.HEARTS_MAX;
    this.invincible  = 0;     // countdown frames of invincibility
    this.hurtKbX     = 0;    // knockback velocity
    // Web trap
    this.trappedTimer   = 0;
    this.trapJumpPresses = 0;
    // Goop slow (set by goop patches each frame)
    this.inGoop = false;
  }

  update(platforms) {
    // ── Invincibility & knockback ─────────────────────────────
    if (this.invincible > 0) this.invincible--;
    if (this.hurtKbX !== 0) {
      this.vx = this.hurtKbX;
      this.hurtKbX = 0;
    }

    // ── Web trap ─────────────────────────────────────────────
    if (this.trappedTimer > 0) {
      this.trappedTimer--;
      this.vx = 0;
      // Check for jump presses to free early
      const jumpPr = TouchControls.consumeJump() || Input.wasPressed('ArrowUp') || Input.wasPressed('KeyW');
      if (jumpPr) {
        this.trapJumpPresses++;
        if (this.trapJumpPresses >= 4) { this.trappedTimer = 0; this.trapJumpPresses = 0; }
      }
      // Still apply gravity and collide
      const grav2 = this.vy < 0 ? CFG.GRAVITY : CFG.FALL_GRAVITY;
      this.vy = Math.min(this.vy + grav2, CFG.TERMINAL_VEL);
      this.y += this.vy;
      this._resolveY(platforms);
      this.wingPhase += 0.12;
      return;
    }

    // ── Goop slow ────────────────────────────────────────────
    const spd  = this.inGoop ? CFG.MOVE_SPEED * 0.5 : CFG.MOVE_SPEED;
    this.inGoop = false; // reset each frame; goop patches set it back

    // ── Horizontal input ──────────────────────────────────────
    if (Input.left()) {
      this.vx = -spd;
      this.facingRight = false;
    } else if (Input.right()) {
      this.vx = spd;
      this.facingRight = true;
    } else {
      this.vx *= CFG.FRICTION;
    }

    // ── Jump (press-edge, supports double jump) ────────────────
    const jumpPressed = TouchControls.consumeJump() || Input.wasPressed('ArrowUp') || Input.wasPressed('KeyW');
    const jumpForce   = this.inGoop ? CFG.JUMP_FORCE * 0.7 : CFG.JUMP_FORCE;
    if (jumpPressed) {
      if (this.onGround) {
        this.vy = jumpForce;
        this.onGround = false;
        this.airJumps = 0;
        Particles.spawn(this.x + this.w / 2, this.y + this.h, {
          count: 10, color: this._accentColor(), star: true, size: 5, rise: 4,
        });
      } else if (this.airJumps < 1) {
        this.vy = CFG.DOUBLE_JUMP_FORCE;
        this.airJumps = 1;
        // Ring of star sparkles for double jump
        for (let i = 0; i < 8; i++) {
          const ang = (Math.PI * 2 * i / 8);
          Particles.spawn(this.x + this.w/2 + Math.cos(ang)*14, this.y + this.h/2 + Math.sin(ang)*14, {
            count: 1, color: ['#fde68a','#c4b5fd','#86efac','#f9a8d4'][i%4],
            star: true, size: 5, rise: 2, spread: 1, decay: 0.04,
          });
        }
      }
    }

    // ── Gravity ───────────────────────────────────────────────
    const grav = this.vy < 0 ? CFG.GRAVITY : CFG.FALL_GRAVITY;
    this.vy = Math.min(this.vy + grav, CFG.TERMINAL_VEL);

    // ── Move & collide X ──────────────────────────────────────
    this.x += this.vx;
    this.x = Math.max(0, Math.min(this.x, CFG.WORLD_W - this.w));
    this._resolveX(platforms);

    // ── Move & collide Y ──────────────────────────────────────
    const wasOnGround = this.onGround;
    this.onGround = false;
    this.y += this.vy;
    this._resolveY(platforms);

    // Landing: reset air jumps
    if (!wasOnGround && this.onGround) {
      this.airJumps = 0;
      Particles.spawn(this.x + this.w / 2, this.y + this.h, {
        count: 8, color: this._accentColor(), spread: 5, rise: 1.5, gravity: 0.12,
      });
    }

    // ── Respawn if fallen ────────────────────────────────────
    if (this.y > CFG.WORLD_H + 120) {
      this.x = 160; this.y = 490; this.vx = 0; this.vy = 0;
    }

    // ── State & animation ────────────────────────────────────
    if (!this.onGround)               this.state = this.vy < 0 ? 'jump' : 'fall';
    else if (Math.abs(this.vx) > 0.4) this.state = 'run';
    else                               this.state = 'idle';

    this.animTick++;
    if (this.state === 'run' && this.animTick % 7 === 0)
      this.animFrame = (this.animFrame + 1) % 6;
    if (this.state !== 'run') this.animFrame = 0;

    this.wingPhase += 0.12;
    if (this.shootTimer > 0) this.shootTimer--;

    // Running dust
    if (this.state === 'run' && this.onGround) {
      this.dustTimer++;
      if (this.dustTimer % 8 === 0) {
        Particles.spawn(this.x + this.w / 2, this.y + this.h, {
          count: 2, color: 'rgba(200,200,255,0.7)', size: 3, rise: 0.5,
          spread: 1.5, decay: 0.04, gravity: -0.01,
        });
      }
    }
  }

  // Call to hurt the player (enemies, projectiles, traps)
  hurt(sourceX) {
    if (this.invincible > 0) return false;
    this.hearts = Math.max(0, this.hearts - 1);
    this.invincible = CFG.INVINCIBLE_FRAMES;
    // Knockback away from source
    this.hurtKbX = (this.x + this.w / 2 > sourceX) ? 5 : -5;
    this.vy = -5;
    return true;
  }

  _resolveX(platforms) {
    for (const p of platforms) {
      if (p.topOnly || p.passable) continue;
      if (p.overlaps(this.x, this.y + 2, this.w, this.h - 4)) {
        if (this.vx > 0) this.x = p.x - this.w;
        else             this.x = p.x + p.w;
        this.vx = 0;
      }
    }
  }

  _resolveY(platforms) {
    for (const p of platforms) {
      if (p.passable) continue;
      if (p.overlaps(this.x + 2, this.y, this.w - 4, this.h)) {
        if (this.vy >= 0) {
          this.y = p.y - this.h;
          this.onGround = true;
          this.vy = 0;
        } else if (!p.topOnly) {
          this.y = p.y + p.h;
          this.vy = 0;
        }
      }
    }
  }

  _accentColor() {
    return this.character === 'penelope' ? '#c084fc' : '#67e8f9';
  }

  draw() {
    // Flicker during invincibility (hide on even 4-frame intervals)
    if (this.invincible > 0 && Math.floor(this.invincible / 4) % 2 === 0) return;
    const s = Camera.toScreen(this.x, this.y);
    ctx.save();
    if (!this.facingRight) {
      ctx.translate(s.x + this.w, s.y);
      ctx.scale(-1, 1);
      this._drawChar(0, 0);
    } else {
      this._drawChar(s.x, s.y);
    }
    ctx.restore();

    // Web trap overlay
    if (this.trappedTimer > 0) {
      const ws = Camera.toScreen(this.x - 8, this.y - 8);
      ctx.save();
      ctx.globalAlpha = 0.7;
      ctx.strokeStyle = '#e2e8f0';
      ctx.lineWidth = 1.5;
      // Simple web lines radiating from center
      const cx = ws.x + this.w / 2 + 8, cy = ws.y + this.h / 2 + 8;
      for (let i = 0; i < 6; i++) {
        const ang = (Math.PI * 2 * i / 6);
        ctx.beginPath(); ctx.moveTo(cx, cy);
        ctx.lineTo(cx + Math.cos(ang) * 22, cy + Math.sin(ang) * 22);
        ctx.stroke();
      }
      for (let r = 8; r <= 20; r += 6) {
        ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
      }
      ctx.restore();
    }
  }

  _drawChar(ox, oy) {
    const { w, h } = this;
    const sq  = this.state === 'jump' ? { sx: 0.85, sy: 1.15 }
              : this.state === 'fall' ? { sx: 1.10, sy: 0.90 }
              :                         { sx: 1,    sy: 1    };
    const bob = this.state === 'run' ? Math.sin(this.animFrame * Math.PI / 3) * 2 : 0;
    ctx.save();
    ctx.translate(ox + w / 2, oy + h / 2 + bob);
    ctx.scale(sq.sx, sq.sy);
    if (this.character === 'penelope')
      drawPenelopeSprite(-w/2, -h/2, w, h, this.state, this.animFrame, this.shootTimer > 0);
    else
      drawParkerSprite(-w/2, -h/2, w, h, this.state, this.animFrame, this.wingPhase);
    ctx.restore();
  }

  _PLACEHOLDER_DELETE_ME() {
  }
}

// ═══════════════════════════════════════════════════════════════
//  BACKGROUND  (sky, parallax clouds, stars)
// ═══════════════════════════════════════════════════════════════
const BG = (() => {
  // Generate background cloud data once
  const bgClouds = Array.from({ length: 35 }, (_, i) => ({
    x:     (i * 997 % CFG.WORLD_W),
    y:     (i * 331 % 550) + 20,
    w:     (i * 157 % 180) + 70,
    h:     (i * 83  % 50)  + 28,
    speed: (i * 13  % 30)  * 0.01 + 0.04,
    alpha: (i * 71  % 35)  * 0.01 + 0.12,
  }));

  function update() {
    for (const c of bgClouds) {
      c.x += c.speed;
      if (c.x > CFG.WORLD_W + 200) c.x = -200;
    }
  }

  function draw() {
    // Sky gradient
    const sg = ctx.createLinearGradient(0, 0, 0, canvas.height);
    sg.addColorStop(0,    '#7dd3fc');
    sg.addColorStop(0.45, '#bae6fd');
    sg.addColorStop(1,    '#e0f2fe');
    ctx.fillStyle = sg;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Distant sparkle stars
    const t = Date.now() * 0.0008;
    for (let i = 0; i < 25; i++) {
      const sx = ((i * 317 + 30) % CFG.WORLD_W) - Camera.x * 0.04;
      const sy = (i * 173 % 350) - Camera.y * 0.04;
      if (sx < -8 || sx > canvas.width + 8 || sy < -8 || sy > canvas.height + 8) continue;
      const pulse = (Math.sin(t * 1.8 + i * 1.3) + 1) * 0.5;
      ctx.globalAlpha = 0.2 + pulse * 0.5;
      ctx.fillStyle = i % 3 === 0 ? '#fde68a' : '#c7d2fe';
      ctx.beginPath(); ctx.arc(sx, sy, 1.5 + pulse * 1.2, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Parallax background clouds
    for (const c of bgClouds) {
      const sx = c.x - Camera.x * 0.28;
      const sy = c.y - Camera.y * 0.08;
      if (sx + c.w < -60 || sx > canvas.width + 60) continue;
      const cx2 = sx + c.w / 2;
      const cy2 = sy + c.h / 2;
      const r   = c.h * 0.52;

      ctx.globalAlpha = c.alpha;
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(cx2, cy2, r * 1.1, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx2 - c.w * 0.26, cy2 + 2, r * 0.85, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx2 + c.w * 0.26, cy2 + 2, r * 0.85, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx2 - c.w * 0.1, cy2 - r * 0.4, r * 0.7, 0, Math.PI * 2); ctx.fill();
      ctx.fillRect(sx + c.w * 0.15, cy2, c.w * 0.7, r + 3);
    }
    ctx.globalAlpha = 1;

    // Distant rainbow (decorative)
    const ry = canvas.height * 0.6 - Camera.y * 0.05;
    const rx = canvas.width * 0.5 - Camera.x * 0.02;
    const rainbowColors = ['rgba(239,68,68,0.15)','rgba(251,146,60,0.12)','rgba(250,204,21,0.12)',
                            'rgba(74,222,128,0.12)','rgba(96,165,250,0.12)','rgba(167,139,250,0.12)'];
    for (let rb = 0; rb < rainbowColors.length; rb++) {
      ctx.strokeStyle = rainbowColors[rb];
      ctx.lineWidth = 10;
      ctx.beginPath();
      ctx.arc(rx, ry + 60, 200 + rb * 14, Math.PI, 0);
      ctx.stroke();
    }
  }

  return { update, draw };
})();

class BounceFlower {
  constructor(wx) {
    this.wx   = wx;        // world X center
    this.wy   = CFG.GROUND_Y; // sits on ground top
    this.w    = 60;
    this.h    = 70;
    // Top hitbox used for landing detection (topOnly-style)
    this.x    = wx - 30;
    this.y    = CFG.GROUND_Y - 70;
    this.topOnly = true;
    this.passable = false;
    this.squash   = 0;    // 0-1 squash amount, decays
    this.sparkles = [];
  }

  overlaps(px, py, pw, ph) {
    return px < this.x + this.w && px + pw > this.x &&
           py < this.y + 8      && py + ph > this.y;
  }

  update(player) {
    if (this.squash > 0) this.squash = Math.max(0, this.squash - 0.07);
    // Sparkles age out
    for (let i = this.sparkles.length - 1; i >= 0; i--) {
      this.sparkles[i].life -= 1;
      if (this.sparkles[i].life <= 0) this.sparkles.splice(i, 1);
    }

    // Check if player just landed on top (player feet near our top surface)
    const onTop = player.vy >= 0 &&
                  player.x + player.w > this.x + 4 &&
                  player.x < this.x + this.w - 4 &&
                  Math.abs((player.y + player.h) - this.y) < 10 &&
                  player.onGround;
    if (onTop) {
      player.vy = CFG.BOUNCE_FORCE;
      player.onGround = false;
      this.squash = 1;
      // Spawn sparkles
      for (let i = 0; i < 8; i++) {
        const ang = (Math.PI * 2 * i / 8) - Math.PI / 2;
        this.sparkles.push({
          x: this.wx, y: this.y,
          vx: Math.cos(ang) * (1.5 + Math.random()),
          vy: Math.sin(ang) * (1.5 + Math.random()) - 1,
          life: 20 + Math.random() * 10,
          color: ['#f9a8d4','#fde68a','#86efac','#c4b5fd'][i % 4],
        });
      }
    }
  }

  draw() {
    if (!Camera.inView(this.x - 10, this.y - 10, this.w + 20, this.h + 20)) return;
    const sc = this.squash;
    const sx = Camera.toScreen(this.wx, 0).x;
    const groundSY = Camera.toScreen(0, CFG.GROUND_Y).y;

    // Stem (squash: shorter + wider)
    const stemH = (this.h - 30) * (1 - sc * 0.3);
    const stemW = 10 * (1 + sc * 0.5);
    ctx.fillStyle = '#16a34a';
    ctx.fillRect(sx - stemW / 2, groundSY - stemH, stemW, stemH);

    // Head center (squash: wider + shorter)
    const headR  = 24 * (1 + sc * 0.3);
    const headCY = groundSY - stemH - headR * (1 - sc * 0.25);

    // Petals (8 petals, pink)
    ctx.fillStyle = '#f9a8d4';
    for (let i = 0; i < 8; i++) {
      const ang = (Math.PI * 2 * i / 8);
      const px = sx + Math.cos(ang) * headR * 1.1;
      const py = headCY + Math.sin(ang) * headR * 1.1;
      ctx.beginPath(); ctx.ellipse(px, py, 10, 7, ang, 0, Math.PI * 2); ctx.fill();
    }

    // Face disk
    const dg = ctx.createRadialGradient(sx, headCY, 2, sx, headCY, headR);
    dg.addColorStop(0, '#fef08a'); dg.addColorStop(1, '#facc15');
    ctx.fillStyle = dg;
    ctx.beginPath(); ctx.arc(sx, headCY, headR, 0, Math.PI * 2); ctx.fill();

    // Smile
    ctx.strokeStyle = '#92400e'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(sx, headCY + 2, headR * 0.45, 0.2, Math.PI - 0.2); ctx.stroke();
    // Eyes
    ctx.fillStyle = '#1e3a1e';
    ctx.beginPath(); ctx.arc(sx - headR * 0.3, headCY - headR * 0.1, 2.5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(sx + headR * 0.3, headCY - headR * 0.1, 2.5, 0, Math.PI * 2); ctx.fill();

    // Sparkles
    for (const sp of this.sparkles) {
      const spsc = Camera.toScreen(sp.x, sp.y);
      ctx.globalAlpha = sp.life / 30;
      ctx.fillStyle = sp.color;
      ctx.beginPath(); ctx.arc(spsc.x + sp.vx * (30 - sp.life), spsc.y + sp.vy * (30 - sp.life), 3, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
}

class FlytrapFlower {
  constructor(wx) {
    this.wx   = wx;
    this.wy   = CFG.GROUND_Y;
    this.w    = 60;
    this.h    = 70;
    this.x    = wx - 30;
    this.y    = CFG.GROUND_Y - 70;
    this.topOnly  = true;
    this.passable = false;

    this.state     = 'open';    // 'open' | 'countdown' | 'closed' | 'reopening'
    this.closeAmt  = 0;         // 0=open mouth, 1=closed
    this.timer     = 0;
    this.flashOn   = false;
  }

  overlaps(px, py, pw, ph) {
    if (this.passable) return false;
    return px < this.x + this.w && px + pw > this.x &&
           py < this.y + 8      && py + ph > this.y;
  }

  update(player) {
    const onTop = player.vy >= 0 &&
                  player.x + player.w > this.x + 6 &&
                  player.x < this.x + this.w - 6 &&
                  Math.abs((player.y + player.h) - this.y) < 10 &&
                  player.onGround;

    if (this.state === 'open') {
      this.closeAmt = 0;
      if (onTop) { this.state = 'countdown'; this.timer = CFG.FLYTRAP_DELAY; }

    } else if (this.state === 'countdown') {
      this.timer--;
      this.closeAmt = 1 - (this.timer / CFG.FLYTRAP_DELAY);
      this.flashOn = this.timer < 30 && Math.floor(this.timer / 5) % 2 === 0;
      if (!onTop) {
        // Player escaped — reopen
        this.state = 'open'; this.closeAmt = 0; this.flashOn = false;
      } else if (this.timer <= 0) {
        // Snap! — hurt player and launch them upward out of the mouth
        this.state = 'closed'; this.timer = 90; this.closeAmt = 1;
        this.passable = true;
        player.hurt(this.wx);
        player.vy = -12;  // launch upward
        Particles.spawn(player.x + player.w / 2, player.y + player.h / 2, {
          count: 12, color: '#f87171', star: true, size: 4, rise: 4,
        });
      }

    } else if (this.state === 'closed') {
      this.timer--;
      if (this.timer <= 0) { this.state = 'reopening'; this.timer = 30; this.passable = false; }

    } else if (this.state === 'reopening') {
      this.timer--;
      this.closeAmt = this.timer / 30;
      if (this.timer <= 0) { this.state = 'open'; this.closeAmt = 0; }
    }
  }

  draw() {
    if (!Camera.inView(this.x - 10, this.y - 10, this.w + 20, this.h + 20)) return;
    const sx    = Camera.toScreen(this.wx, 0).x;
    const groundSY = Camera.toScreen(0, CFG.GROUND_Y).y;

    // Spotted stem
    const stemH = this.h - 30;
    ctx.fillStyle = '#4ade80';
    ctx.fillRect(sx - 6, groundSY - stemH, 12, stemH);
    ctx.fillStyle = 'rgba(0,100,0,0.3)';
    for (let i = 0; i < 4; i++) {
      ctx.beginPath();
      ctx.arc(sx + (i % 2 === 0 ? -3 : 3), groundSY - stemH * (0.2 + i * 0.2), 3, 0, Math.PI * 2);
      ctx.fill();
    }

    // Head: two jaws
    const headCY  = groundSY - stemH - 18;
    const openAng = (1 - this.closeAmt) * 0.55; // max ~31° open gap each jaw
    const flash   = this.flashOn ? 1 : 0;
    const headCol = flash ? '#ff6b6b' : '#a855f7';

    // Bottom jaw
    ctx.fillStyle = headCol;
    ctx.save();
    ctx.translate(sx, headCY);
    ctx.rotate(openAng);
    ctx.beginPath();
    ctx.ellipse(0, 10, 28, 16, 0, 0, Math.PI * 2);
    ctx.fill();
    // Teeth bottom
    ctx.fillStyle = '#fff';
    for (let i = -2; i <= 2; i++) {
      ctx.beginPath(); ctx.moveTo(i * 9 - 4, -2); ctx.lineTo(i * 9, -10); ctx.lineTo(i * 9 + 4, -2); ctx.fill();
    }
    ctx.restore();

    // Top jaw
    ctx.fillStyle = headCol;
    ctx.save();
    ctx.translate(sx, headCY);
    ctx.rotate(-openAng);
    ctx.beginPath();
    ctx.ellipse(0, -10, 28, 16, 0, 0, Math.PI * 2);
    ctx.fill();
    // Teeth top
    ctx.fillStyle = '#fff';
    for (let i = -2; i <= 2; i++) {
      ctx.beginPath(); ctx.moveTo(i * 9 - 4, 2); ctx.lineTo(i * 9, 10); ctx.lineTo(i * 9 + 4, 2); ctx.fill();
    }
    // Red mouth interior
    if (this.closeAmt < 0.9) {
      ctx.fillStyle = '#ef4444';
      ctx.beginPath(); ctx.ellipse(0, 0, 20, 8 * (1 - this.closeAmt), 0, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }
}

function buildGroundFlowers() {
  const bounceXs  = [450, 1050, 1650, 2300, 2800, 3540, 4300];
  const flytrapXs = [750, 1350, 2000, 2550, 3150, 3900];
  return [
    ...bounceXs.map(x  => new BounceFlower(x)),
    ...flytrapXs.map(x => new FlytrapFlower(x)),
  ];
}

//  ENEMIES
// ═══════════════════════════════════════════════════════════════

const enemyProjectiles = [];
const goopPatches = [];      // sticky ground patches left by ghosts
const poisonDusts  = [];     // poison dust particles from butterflies

class Enemy {
  constructor(x, y, w, h) {
    this.x = x; this.y = y; this.w = w; this.h = h;
    this.hp = 3; this.alive = true;
    this.frozenTimer  = 0;   // ice: enemy can't move/attack
    this.poisonTimer  = 0;   // vine: extra damage after 1s
    this.poisonTick   = 0;
    this.facing  = 1;        // 1=right, -1=left
    this.fireTimer = 0;
    this.deathAnim = 0;      // counts down on death (shrink/fade)
  }

  takeDamage(amount, type, player) {
    if (!this.alive) return;
    this.hp -= amount;
    // Extra poison damage after 60 frames
    if (type === 'vine' && this.poisonTimer === 0) {
      this.poisonTimer = 60;
    }
    if (type === 'ice') {
      this.frozenTimer = 120; // 2 seconds
    }
    if (this.hp <= 0) {
      this.alive = false;
      this.deathAnim = 40;
      Particles.spawn(this.x + this.w/2, this.y + this.h/2, {
        count: 16, color: '#fde68a', star: true, size: 7, rise: 5, spread: 6, decay: 0.03,
      });
    }
  }

  _updateTimers() {
    if (this.frozenTimer  > 0) this.frozenTimer--;
    if (this.poisonTimer  > 0) {
      this.poisonTimer--;
      if (this.poisonTimer === 0) this.hp = Math.max(0, this.hp - 1);
      if (this.hp <= 0 && this.alive) {
        this.alive = false; this.deathAnim = 40;
        Particles.spawn(this.x + this.w/2, this.y + this.h/2, {
          count: 12, color: '#4ade80', star: true, size: 5, rise: 4, decay: 0.035,
        });
      }
    }
  }

  _drawHealthBar(sx, sy) {
    if (this.hp >= 3) return; // only show when damaged
    const bw = this.w, bh = 5;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(sx, sy - 10, bw, bh);
    ctx.fillStyle = this.hp === 2 ? '#facc15' : '#f87171';
    ctx.fillRect(sx, sy - 10, bw * (this.hp / 3), bh);
  }

  _drawFrozen(sx, sy) {
    if (this.frozenTimer <= 0) return;
    ctx.globalAlpha = 0.45;
    ctx.fillStyle = '#bae6fd';
    ctx.fillRect(sx - 2, sy - 2, this.w + 4, this.h + 4);
    ctx.globalAlpha = 1;
    // Ice crystals
    ctx.strokeStyle = '#38bdf8'; ctx.lineWidth = 1.5;
    for (let i = 0; i < 3; i++) {
      const cx2 = sx + this.w * (0.2 + i * 0.3), cy2 = sy + this.h * 0.3;
      ctx.beginPath(); ctx.moveTo(cx2, cy2 - 7); ctx.lineTo(cx2, cy2 + 7); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx2 - 5, cy2 - 3); ctx.lineTo(cx2 + 5, cy2 + 3); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(cx2 + 5, cy2 - 3); ctx.lineTo(cx2 - 5, cy2 + 3); ctx.stroke();
    }
  }
}

// ── WEB SPIDER ────────────────────────────────────────────────
class WebSpider extends Enemy {
  constructor(x, y, platform) {
    super(x, y, 42, 32);
    this.platform = platform; // {x, y, w} for edge turning
    this.fireTimer = CFG.SPIDER_FIRE_RATE;
    this.legPhase  = 0;
  }

  update(player) {
    if (!this.alive) return;
    this._updateTimers();
    if (this.frozenTimer > 0) return;

    // Walk back and forth on platform
    this.x += this.facing * 1.4;
    if (this.x < this.platform.x) { this.x = this.platform.x; this.facing = 1; }
    if (this.x + this.w > this.platform.x + this.platform.w) {
      this.x = this.platform.x + this.platform.w - this.w; this.facing = -1;
    }
    this.legPhase += 0.18;

    // Aim at player
    if (!Camera.inView(this.x, this.y, this.w, this.h)) return;
    const dx = (player.x + player.w/2) - (this.x + this.w/2);
    const dy = Math.abs((player.y + player.h/2) - (this.y + this.h/2));
    if (Math.abs(dx) < 350 && dy < 120) {
      this.facing = dx > 0 ? 1 : -1;
      this.fireTimer--;
      if (this.fireTimer <= 0) {
        this.fireTimer = CFG.SPIDER_FIRE_RATE;
        const spd = dx > 0 ? 4.5 : -4.5;
        enemyProjectiles.push({ type:'web', x: this.x+this.w/2, y: this.y+8, vx:spd, vy:-1, w:14, h:14, active:true, age:0 });
      }
    }
  }

  draw() {
    if (!this.alive && this.deathAnim <= 0) return;
    if (!Camera.inView(this.x, this.y, this.w, this.h)) return;
    const { x: sx, y: sy } = Camera.toScreen(this.x, this.y);
    ctx.save();
    if (this.deathAnim > 0) {
      this.deathAnim--;
      const sc = this.deathAnim / 40;
      ctx.globalAlpha = sc;
      ctx.translate(sx + this.w/2, sy + this.h/2);
      ctx.scale(sc, sc);
      ctx.translate(-this.w/2, -this.h/2);
    }
    if (this.facing === -1) { ctx.translate(sx + this.w, sy); ctx.scale(-1,1); this._draw(0, 0); }
    else this._draw(sx, sy);
    ctx.restore();
  }

  _draw(sx, sy) {
    const lp = this.legPhase;
    // 8 legs
    ctx.strokeStyle = '#4c1d95'; ctx.lineWidth = 2;
    for (let i = 0; i < 4; i++) {
      const side = i < 2 ? -1 : 1;
      const ang = (Math.sin(lp + i * 1.1) * 0.4);
      const lx = sx + this.w/2 + side * 10;
      const ly = sy + this.h * 0.6;
      ctx.beginPath(); ctx.moveTo(lx, ly);
      ctx.lineTo(lx + side*(14+i*2), ly - 8 + Math.sin(ang)*6);
      ctx.lineTo(lx + side*(20+i*2), ly + 6);
      ctx.stroke();
    }
    // Body
    const bg = ctx.createRadialGradient(sx+this.w/2, sy+this.h*0.55, 2, sx+this.w/2, sy+this.h*0.55, 16);
    bg.addColorStop(0,'#7c3aed'); bg.addColorStop(1,'#1e1b4b');
    ctx.fillStyle = bg;
    ctx.beginPath(); ctx.ellipse(sx+this.w/2, sy+this.h*0.6, 15, 12, 0, 0, Math.PI*2); ctx.fill();
    // Head
    ctx.fillStyle = '#4c1d95';
    ctx.beginPath(); ctx.ellipse(sx+this.w/2, sy+this.h*0.28, 11, 9, 0, 0, Math.PI*2); ctx.fill();
    // Eyes
    [[-5,0],[5,0]].forEach(([ex,ey]) => {
      ctx.fillStyle = '#fde68a';
      ctx.beginPath(); ctx.arc(sx+this.w/2+ex, sy+this.h*0.28+ey-1, 4, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#1e1b4b';
      ctx.beginPath(); ctx.arc(sx+this.w/2+ex+0.5, sy+this.h*0.28+ey-1, 2, 0, Math.PI*2); ctx.fill();
    });
    this._drawFrozen(sx, sy);
    this._drawHealthBar(sx, sy);
  }
}

// ── GHOST ─────────────────────────────────────────────────────
class Ghost extends Enemy {
  constructor(x, y) {
    super(x, y, 40, 50);
    this.baseY = y;
    this.bobPhase = Math.random() * Math.PI * 2;
    this.driftX   = (Math.random() > 0.5 ? 1 : -1) * 0.8;
    this.fireTimer = CFG.GHOST_FIRE_RATE;
    this.hp = 3;
  }

  update(player) {
    if (!this.alive) return;
    this._updateTimers();
    if (this.frozenTimer > 0) return;
    this.bobPhase += 0.04;
    this.y = this.baseY + Math.sin(this.bobPhase) * 22;
    this.x += this.driftX;
    if (this.x < 100 || this.x > CFG.WORLD_W - 100) this.driftX *= -1;
    if (!Camera.inView(this.x, this.y, this.w, this.h)) return;
    const dx = (player.x+player.w/2)-(this.x+this.w/2);
    if (Math.abs(dx) < 420) {
      this.fireTimer--;
      if (this.fireTimer <= 0) {
        this.fireTimer = CFG.GHOST_FIRE_RATE;
        const spd = dx > 0 ? 3 : -3;
        enemyProjectiles.push({ type:'goop', x:this.x+this.w/2, y:this.y+this.h, vx:spd, vy:-4, w:16, h:16, active:true, age:0 });
      }
    }
  }

  draw() {
    if (!this.alive && this.deathAnim <= 0) return;
    if (!Camera.inView(this.x, this.y, this.w, this.h)) return;
    const { x: sx, y: sy } = Camera.toScreen(this.x, this.y);
    ctx.save();
    if (this.deathAnim > 0) {
      this.deathAnim--;
      const sc = this.deathAnim / 40;
      ctx.globalAlpha = sc;
      ctx.translate(sx+this.w/2, sy+this.h/2); ctx.scale(sc,sc); ctx.translate(-this.w/2,-this.h/2);
    } else {
      ctx.globalAlpha = 0.82;
    }
    // Body
    ctx.fillStyle = '#e0f2fe';
    ctx.beginPath();
    ctx.arc(sx+this.w/2, sy+this.h*0.38, 18, Math.PI, 0);
    ctx.lineTo(sx+this.w, sy+this.h);
    // Wavy bottom
    for (let i = 4; i >= 0; i--) {
      const wbx = sx + this.w * (i / 4);
      ctx.lineTo(wbx, sy+this.h - (i%2===0?6:0));
    }
    ctx.closePath(); ctx.fill();
    // Face
    ctx.fillStyle = '#1e3a5f';
    ctx.beginPath(); ctx.arc(sx+this.w/2-7, sy+this.h*0.32, 4, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(sx+this.w/2+7, sy+this.h*0.32, 4, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#1e3a5f'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(sx+this.w/2, sy+this.h*0.52, 7, 0.1, Math.PI-0.1); ctx.stroke();
    this._drawFrozen(sx, sy);
    this._drawHealthBar(sx, sy);
    ctx.restore();
  }
}

// ── HAUNTED TREE ──────────────────────────────────────────────

  update(player) {

    if (Math.abs(dx) < 400) {
      this.fireTimer--;

    ctx.beginPath(); ctx.arc(sx+this.w/2+14, sy+this.h*0.26, 16, 0, Math.PI*2); ctx.fill();

// ── POISON BUTTERFLY ──────────────────────────────────────────
class PoisonButterfly extends Enemy {
  constructor(x, y, patrolW) {
    super(x, y, 40, 36);
    this.startX   = x;
    this.patrolW  = patrolW ?? 300;
    this.wingPhase = 0;
    this.wavePhase = 0;
    this.dustTimer = 0;
  }

  update(player) {
    if (!this.alive) return;
    this._updateTimers();
    if (this.frozenTimer > 0) return;
    this.x += this.facing * 1.6;
    if (this.x < this.startX)                    { this.x = this.startX;             this.facing =  1; }
    if (this.x + this.w > this.startX+this.patrolW) { this.x = this.startX+this.patrolW-this.w; this.facing = -1; }
    this.wingPhase += 0.22;
    this.wavePhase += 0.06;
    this.y += Math.sin(this.wavePhase) * 0.5;

    // Drop poison dust
    if (!Camera.inView(this.x, this.y, this.w, this.h)) return;
    this.dustTimer++;
    if (this.dustTimer % 8 === 0) {
      poisonDusts.push({ x:this.x+this.w/2, y:this.y+this.h, vx:(Math.random()-0.5)*0.6, vy:0.4, life:1, decay:0.011, r:5 });
    }
  }

  draw() {
    if (!this.alive && this.deathAnim <= 0) return;
    if (!Camera.inView(this.x, this.y, this.w, this.h)) return;
    const { x: sx, y: sy } = Camera.toScreen(this.x, this.y);
    ctx.save();
    if (this.deathAnim > 0) {
      this.deathAnim--;
      const sc = this.deathAnim/40;
      ctx.globalAlpha = sc;
      ctx.translate(sx+this.w/2,sy+this.h/2); ctx.scale(sc,sc); ctx.translate(-this.w/2,-this.h/2);
    }
    const wf = Math.sin(this.wingPhase);
    // Wings (top)
    ctx.fillStyle = '#86efac';
    ctx.beginPath(); ctx.ellipse(sx+this.w/2-14*Math.abs(wf), sy+this.h*0.3, 16, 10, -0.4+wf*0.3, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(sx+this.w/2+14*Math.abs(wf), sy+this.h*0.3, 16, 10, 0.4-wf*0.3, 0, Math.PI*2); ctx.fill();
    // Wings (bottom)
    ctx.fillStyle = '#a855f7';
    ctx.beginPath(); ctx.ellipse(sx+this.w/2-10*Math.abs(wf), sy+this.h*0.56, 11, 8, -0.6+wf*0.3, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(sx+this.w/2+10*Math.abs(wf), sy+this.h*0.56, 11, 8, 0.6-wf*0.3, 0, Math.PI*2); ctx.fill();
    // Purple spots on wings
    ctx.fillStyle = '#7e22ce';
    ctx.beginPath(); ctx.arc(sx+this.w/2-14*Math.abs(wf),sy+this.h*0.28,4,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(sx+this.w/2+14*Math.abs(wf),sy+this.h*0.28,4,0,Math.PI*2); ctx.fill();
    // Body
    ctx.fillStyle = '#166534';
    ctx.beginPath(); ctx.ellipse(sx+this.w/2,sy+this.h*0.45,5,13,0,0,Math.PI*2); ctx.fill();
    // Face
    ctx.fillStyle = '#fde68a';
    ctx.beginPath(); ctx.arc(sx+this.w/2,sy+this.h*0.18,6,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#1e3a1e';
    ctx.beginPath(); ctx.arc(sx+this.w/2-2.5,sy+this.h*0.17,1.5,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(sx+this.w/2+2.5,sy+this.h*0.17,1.5,0,Math.PI*2); ctx.fill();
    this._drawFrozen(sx, sy);
    this._drawHealthBar(sx, sy);
