<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>The 3 P's Heroic Adventure</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #0c1445;
      overflow: hidden;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      font-family: Georgia, serif;
    }
    #wrapper {
      width: 100vw;
      height: 100dvh; /* dynamic viewport height — respects iPad browser chrome */
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas {
      display: block;
      /* CSS size set by JS to fill screen while keeping 900×506 aspect ratio */
      touch-action: none;
    }
  </style>
</head>
<body>
<div id="wrapper">
<canvas id="gameCanvas" width="900" height="506"></canvas>
</div>

<script>
// ═══════════════════════════════════════════════════════════════
//  THE 3 P'S HEROIC ADVENTURE  —  Session 1: Sky Island World
//  Architecture: Input → Update (Physics/AI) → Draw
//  Future hooks: enemies[], projectiles[], worlds[], helpers[]
// ═══════════════════════════════════════════════════════════════

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// ── Responsive full-screen scaling ────────────────────────────
// Internal resolution is fixed at 900×506; CSS scales to fill the viewport.
// All game coordinates (camera, HUD, touch hit-tests) stay in 900×506 space.
const NATIVE_W = 900, NATIVE_H = 506;
let _cssScale = 1; // current CSS px per canvas px — used for touch mapping

function resizeCanvas() {
  const sw = window.innerWidth, sh = window.innerHeight;
  _cssScale = Math.min(sw / NATIVE_W, sh / NATIVE_H);
  canvas.style.width  = (_cssScale * NATIVE_W) + 'px';
  canvas.style.height = (_cssScale * NATIVE_H) + 'px';
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// Touch detection (hide keyboard hints when touch device)
const IS_TOUCH = 'ontouchstart' in window || navigator.maxTouchPoints > 0;

// ── Tunable constants ─────────────────────────────────────────
const CFG = {
  GRAVITY:         0.42,
  JUMP_FORCE:     -11.5,
  MOVE_SPEED:      4.8,
  FRICTION:        0.76,   // horizontal deceleration when no key held
  TERMINAL_VEL:   14,
  WORLD_W:        5000,
  WORLD_H:        1000,
  CAM_LERP:       0.09,
};

// ── roundRect polyfill (safety for older browsers) ────────────
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    this.beginPath();
    this.moveTo(x + r, y);
    this.lineTo(x + w - r, y);
    this.arcTo(x + w, y, x + w, y + r, r);
    this.lineTo(x + w, y + h - r);
    this.arcTo(x + w, y + h, x + w - r, y + h, r);
    this.lineTo(x + r, y + h);
    this.arcTo(x, y + h, x, y + h - r, r);
    this.lineTo(x, y + r);
    this.arcTo(x, y, x + r, y, r);
    this.closePath();
  };
}

// ═══════════════════════════════════════════════════════════════
//  INPUT  (keyboard + touch — both update the same logical state)
// ═══════════════════════════════════════════════════════════════

// Touch button state — written by TouchControls, read by Input
const _touch = { left: false, right: false, jump: false };

const Input = (() => {
  const held = {};
  const pressed = {};
  window.addEventListener('keydown', e => {
    if (!held[e.code]) pressed[e.code] = true;
    held[e.code] = true;
    if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Tab'].includes(e.code))
      e.preventDefault();
  });
  window.addEventListener('keyup', e => { held[e.code] = false; });
  return {
    left:       () => held['ArrowLeft']  || held['KeyA']  || _touch.left,
    right:      () => held['ArrowRight'] || held['KeyD']  || _touch.right,
    jump:       () => held['ArrowUp'] || held['KeyW'] || _touch.jump,
    wasPressed: (code) => { const v = pressed[code]; pressed[code] = false; return v; },
    clearFrame: () => { for (const k in pressed) pressed[k] = false; },
  };
})();

// ═══════════════════════════════════════════════════════════════
//  TOUCH CONTROLS
//  Bottom-left : [◀] [▶]
//  Bottom-center: [SWAP]  (character switch)
//  Bottom-right : [✦ SHOOT] [▲ JUMP]
//  All coords in 900×506 canvas-space; hit-tests divide by _cssScale.
// ═══════════════════════════════════════════════════════════════
const TouchControls = (() => {
  const S  = 84;   // button size (canvas px)
  const G  = 10;   // gap between sibling buttons
  const SW = 72;   // swap button width (slightly narrower)
  const MX = 22;   // margin from canvas edge
  const MY = 18;   // margin from canvas bottom

  function toCanvas(clientX, clientY) {
    const r = canvas.getBoundingClientRect();
    return {
      x: (clientX - r.left) / _cssScale,
      y: (clientY - r.top)  / _cssScale,
    };
  }

  function rect(id) {
    const y  = NATIVE_H - MY - S;
    const sy = NATIVE_H - MY - S + (S - SW) / 2;  // vertically center swap
    switch (id) {
      case 'left':  return { x: MX,                           y,  w: S,  h: S  };
      case 'right': return { x: MX + S + G,                   y,  w: S,  h: S  };
      case 'swap':  return { x: NATIVE_W / 2 - SW / 2,        y: sy, w: SW, h: SW };
      case 'shoot': return { x: NATIVE_W - MX - S * 2 - G,    y,  w: S,  h: S  };
      case 'jump':  return { x: NATIVE_W - MX - S,            y,  w: S,  h: S  };
    }
  }

  function hit(cx, cy, id) {
    const r = rect(id);
    return cx >= r.x && cx <= r.x + r.w && cy >= r.y && cy <= r.y + r.h;
  }

  // One-shot flags for tap actions
  let _shootFired = false, _shootFlash = 0;
  let _swapFired  = false, _swapFlash  = 0;

  function syncHeld(touches) {
    _touch.left = false; _touch.right = false; _touch.jump = false;
    for (let i = 0; i < touches.length; i++) {
      const { x, y } = toCanvas(touches[i].clientX, touches[i].clientY);
      if (hit(x, y, 'left'))  _touch.left  = true;
      if (hit(x, y, 'right')) _touch.right = true;
      if (hit(x, y, 'jump'))  _touch.jump  = true;
    }
  }

  canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    syncHeld(e.touches);
    for (let i = 0; i < e.changedTouches.length; i++) {
      const { x, y } = toCanvas(e.changedTouches[i].clientX, e.changedTouches[i].clientY);
      if (hit(x, y, 'shoot')) { _shootFired = true; _shootFlash = 10; }
      if (hit(x, y, 'swap'))  { _swapFired  = true; _swapFlash  = 12; }
    }
  }, { passive: false });

  canvas.addEventListener('touchmove',   e => { e.preventDefault(); syncHeld(e.touches); }, { passive: false });
  canvas.addEventListener('touchend',    e => { e.preventDefault(); syncHeld(e.touches); }, { passive: false });
  canvas.addEventListener('touchcancel', e => {
    e.preventDefault();
    _touch.left = false; _touch.right = false; _touch.jump = false;
  }, { passive: false });

  function consumeShoot() {
    const v = _shootFired; _shootFired = false;
    if (_shootFlash > 0) _shootFlash--;
    return v;
  }
  function consumeSwap() {
    const v = _swapFired; _swapFired = false;
    if (_swapFlash > 0) _swapFlash--;
    return v;
  }

  // ── Button rendering ──────────────────────────────────────
  const themes = {
    left:  { a: '#14532d', b: '#052e16', border: '#4ade80', icon: '◀',       twoLine: false },
    right: { a: '#14532d', b: '#052e16', border: '#4ade80', icon: '▶',       twoLine: false },
    swap:  { a: '#92400e', b: '#451a03', border: '#fbbf24', icon: '✨\nSWAP', twoLine: true  },
    shoot: { a: '#4c1d95', b: '#2e1065', border: '#c084fc', icon: '✦\nSHOOT',twoLine: true  },
    jump:  { a: '#075985', b: '#0c4a6e', border: '#38bdf8', icon: '▲\nJUMP', twoLine: true  },
  };

  function drawBtn(id, active) {
    const r = rect(id);
    const t = themes[id];
    const oy = active ? 2 : 0;  // press-down shift

    // Hard drop shadow — gives depth against any background
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.roundRect(r.x + 4, r.y + 6 + oy, r.w, r.h, 18);
    ctx.fill();

    // Dark outer ring (contrast ring that works on both light and dark BG)
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.roundRect(r.x - 2, r.y - 2 + oy, r.w + 4, r.h + 4, 20);
    ctx.fill();

    // Button body — fully opaque gradient
    const grad = ctx.createLinearGradient(r.x, r.y + oy, r.x, r.y + r.h + oy);
    grad.addColorStop(0, active ? t.b : t.a);
    grad.addColorStop(1, active ? t.a : t.b);
    ctx.fillStyle = grad;
    ctx.globalAlpha = 1;
    ctx.roundRect(r.x, r.y + oy, r.w, r.h, 18);
    ctx.fill();

    // Coloured border — always full opacity so it reads clearly
    ctx.strokeStyle = t.border;
    ctx.lineWidth = active ? 3 : 2.5;
    if (active) { ctx.shadowColor = t.border; ctx.shadowBlur = 16; }
    ctx.roundRect(r.x, r.y + oy, r.w, r.h, 18);
    ctx.stroke();
    ctx.shadowBlur = 0;

    // Inner highlight strip (top edge glint)
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    ctx.roundRect(r.x + 6, r.y + oy + 4, r.w - 12, r.h * 0.3, 10);
    ctx.fill();

    // Label text with strong shadow so it pops off any colour
    ctx.fillStyle = '#ffffff';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = 'rgba(0,0,0,0.9)';
    ctx.shadowBlur = 6;
    const cy = r.y + oy + r.h / 2;
    if (!t.twoLine) {
      ctx.font = `bold ${Math.round(r.h * 0.52)}px Georgia`;
      ctx.fillText(t.icon, r.x + r.w / 2, cy);
    } else {
      const [top, bot] = t.icon.split('\n');
      ctx.font = `bold ${Math.round(r.h * 0.32)}px Georgia`;
      ctx.fillText(top, r.x + r.w / 2, cy - r.h * 0.14);
      ctx.font = `bold ${Math.round(r.h * 0.21)}px Georgia`;
      ctx.fillText(bot, r.x + r.w / 2, cy + r.h * 0.22);
    }
    ctx.shadowBlur = 0;
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
  }

  function draw() {
    if (!IS_TOUCH) return;
    drawBtn('left',  _touch.left);
    drawBtn('right', _touch.right);
    drawBtn('swap',  _swapFlash > 0);
    drawBtn('shoot', _shootFlash > 0);
    drawBtn('jump',  _touch.jump);
  }

  return { consumeShoot, consumeSwap, draw };
})();

// ═══════════════════════════════════════════════════════════════
//  CAMERA
// ═══════════════════════════════════════════════════════════════
const Camera = {
  x: 0, y: 0,
  W: canvas.width, H: canvas.height,

  update(target) {
    const tx = target.x + target.w / 2 - this.W / 2;
    const ty = target.y + target.h / 2 - this.H * 0.52;
    this.x += (tx - this.x) * CFG.CAM_LERP;
    this.y += (ty - this.y) * CFG.CAM_LERP;
    this.x = Math.max(0, Math.min(this.x, CFG.WORLD_W - this.W));
    this.y = Math.max(0, Math.min(this.y, CFG.WORLD_H - this.H));
  },

  toScreen(wx, wy) { return { x: wx - this.x, y: wy - this.y }; },

  inView(x, y, w, h, pad = 60) {
    return x + w > this.x - pad && x < this.x + this.W + pad &&
           y + h > this.y - pad && y < this.y + this.H + pad;
  },
};

// ═══════════════════════════════════════════════════════════════
//  PARTICLES  (sparkles, dust, landing puffs)
// ═══════════════════════════════════════════════════════════════
const Particles = (() => {
  const pool = [];

  function spawn(x, y, opts = {}) {
    const count = opts.count ?? 6;
    for (let i = 0; i < count; i++) {
      pool.push({
        x, y,
        vx: (Math.random() - 0.5) * (opts.spread ?? 3.5),
        vy: -Math.random() * (opts.rise ?? 3) - 0.5,
        color: opts.color ?? '#fbbf24',
        size:  Math.random() * (opts.size ?? 4) + 2,
        life:  1,
        decay: opts.decay ?? 0.025,
        gravity: opts.gravity ?? 0.06,
        star: opts.star ?? false,
      });
    }
  }

  function update() {
    for (let i = pool.length - 1; i >= 0; i--) {
      const p = pool[i];
      p.x += p.vx; p.y += p.vy;
      p.vy += p.gravity;
      p.vx *= 0.97;
      p.life -= p.decay;
      if (p.life <= 0) pool.splice(i, 1);
    }
  }

  function draw() {
    for (const p of pool) {
      const s = Camera.toScreen(p.x, p.y);
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      if (p.star) {
        drawStar(ctx, s.x, s.y, p.size * p.life, 5, p.color);
      } else {
        ctx.beginPath();
        ctx.arc(s.x, s.y, p.size * p.life, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
  }

  return { spawn, update, draw };
})();

// Shared star draw helper
function drawStar(ctx, cx, cy, r, points, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  for (let i = 0; i < points * 2; i++) {
    const angle = (i * Math.PI) / points - Math.PI / 2;
    const rad   = i % 2 === 0 ? r : r * 0.42;
    if (i === 0) ctx.moveTo(cx + rad * Math.cos(angle), cy + rad * Math.sin(angle));
    else         ctx.lineTo(cx + rad * Math.cos(angle), cy + rad * Math.sin(angle));
  }
  ctx.closePath();
  ctx.fill();
}

// ═══════════════════════════════════════════════════════════════
//  CHARACTER SPRITES
//  Standalone functions — called by Player and SelectScreen.
//  x,y = top-left of bounding box; w,h = box size.
//  All internal positions are fractions of w/h so they scale.
// ═══════════════════════════════════════════════════════════════

function drawPenelopeSprite(x, y, w, h, state, animFrame) {
  const cx = x + w / 2;
  const af = animFrame || 0;
  const run = state === 'run';
  const armSwing = run ? Math.sin(af * Math.PI / 3) * 10 : 0;
  const legSwing = run ? Math.sin(af * Math.PI / 3) * 8  : 0;

  // Key Y positions
  const headR  = h * 0.095;
  const headY  = y + h * 0.122;
  const shldY  = y + h * 0.265;
  const waistY = y + h * 0.500;
  const hipY   = y + h * 0.575;
  const kneeY  = y + h * 0.740;
  const ankleY = y + h * 0.870;
  const footY  = y + h;
  const bw     = w * 0.46; // body width

  ctx.lineCap = 'round'; ctx.lineJoin = 'round';

  // ── Pigtails (drawn behind head) ─────────────────────────
  ctx.strokeStyle = '#e2e8f0'; ctx.lineWidth = w * 0.13;
  // Left pigtail: arcs up then cascades down past shoulder
  ctx.beginPath();
  ctx.moveTo(cx - headR * 0.5, headY - headR * 0.4);
  ctx.bezierCurveTo(cx - w * 0.65, headY - headR * 3.2,
                    cx - w * 0.75, headY - headR * 1.0,
                    cx - w * 0.52, shldY + (waistY - shldY) * 0.7);
  ctx.stroke();
  // Right pigtail
  ctx.beginPath();
  ctx.moveTo(cx + headR * 0.5, headY - headR * 0.4);
  ctx.bezierCurveTo(cx + w * 0.65, headY - headR * 3.2,
                    cx + w * 0.75, headY - headR * 1.0,
                    cx + w * 0.52, shldY + (waistY - shldY) * 0.7);
  ctx.stroke();
  // Pigtail hair ties (gold ribbon)
  ctx.fillStyle = '#d97706';
  ctx.beginPath(); ctx.arc(cx - headR * 0.5, headY - headR * 0.35, w * 0.04, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx + headR * 0.5, headY - headR * 0.35, w * 0.04, 0, Math.PI * 2); ctx.fill();

  // ── Short cape (behind body) ──────────────────────────────
  ctx.fillStyle = '#f8fafc';
  ctx.beginPath();
  ctx.moveTo(cx - bw * 0.55, shldY);
  ctx.lineTo(cx - bw * 0.45, waistY - (waistY - shldY) * 0.22);
  ctx.lineTo(cx + bw * 0.45, waistY - (waistY - shldY) * 0.22);
  ctx.lineTo(cx + bw * 0.55, shldY);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#d97706'; ctx.lineWidth = w * 0.04; ctx.stroke();
  // Cape shoulder jewels
  const jewR = w * 0.055;
  ctx.fillStyle = '#dc2626';
  ctx.beginPath(); ctx.arc(cx - bw * 0.48, shldY + jewR, jewR, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx + bw * 0.48, shldY + jewR, jewR, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#fca5a5';
  ctx.beginPath(); ctx.arc(cx - bw * 0.50, shldY + jewR * 0.7, jewR * 0.45, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx + bw * 0.46, shldY + jewR * 0.7, jewR * 0.45, 0, Math.PI * 2); ctx.fill();

  // ── Legs (black tights) ───────────────────────────────────
  ctx.strokeStyle = '#1e1b4b'; ctx.lineWidth = w * 0.17;
  ctx.beginPath(); ctx.moveTo(cx - w*0.13, hipY); ctx.lineTo(cx - w*0.11, ankleY + legSwing*0.4); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx + w*0.13, hipY); ctx.lineTo(cx + w*0.11, ankleY - legSwing*0.4); ctx.stroke();
  // Brown boots
  ctx.fillStyle = '#92400e';
  ctx.roundRect(cx - w*0.22, ankleY + legSwing*0.4, w*0.22, footY - ankleY, [3,3,5,5]); ctx.fill();
  ctx.roundRect(cx + w*0.00, ankleY - legSwing*0.4, w*0.22, footY - ankleY, [3,3,5,5]); ctx.fill();
  ctx.fillStyle = '#a16207';
  ctx.fillRect(cx - w*0.20, ankleY + legSwing*0.4 + 1, w*0.04, footY - ankleY - 2);
  ctx.fillRect(cx + w*0.02, ankleY - legSwing*0.4 + 1, w*0.04, footY - ankleY - 2);

  // ── Bow arm (left, holds bow) ─────────────────────────────
  ctx.strokeStyle = '#fde68a'; ctx.lineWidth = w * 0.13;
  ctx.beginPath();
  ctx.moveTo(cx - bw*0.45, shldY + (waistY-shldY)*0.1);
  ctx.bezierCurveTo(cx - bw*0.6, shldY + (waistY-shldY)*0.5 + armSwing*0.3,
                    cx - bw*0.65, waistY - (waistY-shldY)*0.15,
                    cx - bw*0.58, waistY + armSwing*0.25);
  ctx.stroke();
  // Right arm (string arm)
  ctx.beginPath();
  ctx.moveTo(cx + bw*0.45, shldY + (waistY-shldY)*0.1);
  ctx.bezierCurveTo(cx + bw*0.55, shldY + (waistY-shldY)*0.35 - armSwing*0.3,
                    cx + bw*0.52, waistY - (waistY-shldY)*0.3,
                    cx + bw*0.38, waistY - armSwing*0.25);
  ctx.stroke();

  // ── Bow ───────────────────────────────────────────────────
  const bowX = cx - bw * 0.62;
  const bowMY = shldY + (waistY - shldY) * 0.5 + armSwing * 0.25;
  const bowH  = (waistY - shldY) * 0.7;
  ctx.strokeStyle = '#78350f'; ctx.lineWidth = w * 0.055;
  ctx.beginPath();
  ctx.moveTo(bowX, bowMY - bowH * 0.5);
  ctx.bezierCurveTo(bowX - w*0.18, bowMY - bowH*0.6, bowX - w*0.18, bowMY + bowH*0.6, bowX, bowMY + bowH*0.5);
  ctx.stroke();
  // Bow string
  const pullX = bowX + w * 0.06;
  ctx.strokeStyle = '#fef3c7'; ctx.lineWidth = w * 0.025;
  ctx.beginPath(); ctx.moveTo(bowX, bowMY - bowH*0.5); ctx.lineTo(pullX, bowMY); ctx.lineTo(bowX, bowMY + bowH*0.5); ctx.stroke();
  // Arrow nocked on string (ice blue, pointing right)
  const arrowTip = cx + bw * 0.35;
  ctx.strokeStyle = '#bae6fd'; ctx.lineWidth = w * 0.04;
  ctx.beginPath(); ctx.moveTo(pullX, bowMY); ctx.lineTo(arrowTip, bowMY); ctx.stroke();
  // Arrowhead
  ctx.fillStyle = '#38bdf8';
  ctx.beginPath(); ctx.moveTo(arrowTip + w*0.08, bowMY); ctx.lineTo(arrowTip, bowMY - w*0.045); ctx.lineTo(arrowTip, bowMY + w*0.045); ctx.closePath(); ctx.fill();
  // Ice crystal shimmer on arrowhead
  ctx.fillStyle = 'rgba(255,255,255,0.7)';
  ctx.beginPath(); ctx.arc(arrowTip + w*0.04, bowMY - w*0.02, w*0.02, 0, Math.PI*2); ctx.fill();
  // Fletching
  ctx.strokeStyle = '#c7d2fe'; ctx.lineWidth = w * 0.03;
  ctx.beginPath(); ctx.moveTo(pullX + w*0.02, bowMY); ctx.lineTo(pullX - w*0.06, bowMY - w*0.05); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(pullX + w*0.02, bowMY); ctx.lineTo(pullX - w*0.06, bowMY + w*0.05); ctx.stroke();

  // ── Body — jacket over striped shirt ─────────────────────
  // Striped shirt (center strip)
  const sW = bw * 0.38, sX = cx - sW / 2;
  const strH = (waistY - shldY) / 6;
  for (let i = 0; i < 6; i++) {
    ctx.fillStyle = i % 2 === 0 ? '#1f2937' : '#ffffff';
    ctx.fillRect(sX, shldY + i * strH, sW, strH);
  }
  // White jacket (sides over stripes)
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(cx - bw*0.5, shldY, bw*0.28, waistY - shldY);
  ctx.fillRect(cx + bw*0.22, shldY, bw*0.28, waistY - shldY);
  // Jacket lapel lines (gold)
  ctx.strokeStyle = '#d97706'; ctx.lineWidth = w * 0.04;
  ctx.beginPath(); ctx.moveTo(cx - bw*0.1, shldY); ctx.lineTo(cx - bw*0.28, waistY - (waistY-shldY)*0.3); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx + bw*0.1, shldY); ctx.lineTo(cx + bw*0.28, waistY - (waistY-shldY)*0.3); ctx.stroke();
  // Gold jacket outline
  ctx.strokeStyle = '#d97706'; ctx.lineWidth = w * 0.03;
  ctx.strokeRect(cx - bw*0.5, shldY, bw, waistY - shldY);
  // Gold cuffs
  ctx.fillStyle = '#d97706';
  const cuffR = w * 0.09;
  ctx.beginPath(); ctx.arc(cx - bw*0.58, waistY + armSwing*0.25, cuffR, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(cx + bw*0.38, waistY - armSwing*0.25, cuffR, 0, Math.PI*2); ctx.fill();
  // Black belt
  ctx.fillStyle = '#111827';
  ctx.roundRect(cx - bw*0.52, waistY - h*0.03, bw*1.04, h*0.06, h*0.02); ctx.fill();
  ctx.fillStyle = '#d97706';
  ctx.roundRect(cx - w*0.06, waistY - h*0.025, w*0.12, h*0.05, h*0.015); ctx.fill();
  // White skirt
  ctx.fillStyle = '#f8fafc';
  ctx.beginPath();
  ctx.moveTo(cx - bw*0.52, hipY);
  ctx.lineTo(cx - bw*0.65, kneeY - (kneeY-hipY)*0.08);
  ctx.lineTo(cx + bw*0.65, kneeY - (kneeY-hipY)*0.08);
  ctx.lineTo(cx + bw*0.52, hipY);
  ctx.closePath(); ctx.fill();
  // Gold skirt hem
  ctx.strokeStyle = '#d97706'; ctx.lineWidth = w * 0.045;
  ctx.beginPath();
  ctx.moveTo(cx - bw*0.65, kneeY - (kneeY-hipY)*0.08);
  ctx.lineTo(cx + bw*0.65, kneeY - (kneeY-hipY)*0.08); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx - bw*0.52, hipY); ctx.lineTo(cx - bw*0.65, kneeY - (kneeY-hipY)*0.08); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx + bw*0.52, hipY); ctx.lineTo(cx + bw*0.65, kneeY - (kneeY-hipY)*0.08); ctx.stroke();

  // ── Large pointed elf ears ────────────────────────────────
  ctx.fillStyle = '#fde68a';
  ctx.beginPath();
  ctx.moveTo(cx - headR*0.82, headY - headR*0.1);
  ctx.lineTo(cx - headR*2.6,  headY - headR*0.9);
  ctx.lineTo(cx - headR*0.88, headY + headR*0.45);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#f59e0b'; ctx.lineWidth = w*0.025; ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(cx + headR*0.82, headY - headR*0.1);
  ctx.lineTo(cx + headR*2.6,  headY - headR*0.9);
  ctx.lineTo(cx + headR*0.88, headY + headR*0.45);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#f59e0b'; ctx.lineWidth = w*0.025; ctx.stroke();

  // ── Head ──────────────────────────────────────────────────
  ctx.fillStyle = '#fde68a';
  ctx.beginPath(); ctx.ellipse(cx, headY, headR*0.86, headR, 0, 0, Math.PI*2); ctx.fill();

  // ── Hair top (white, center-parted) ──────────────────────
  ctx.fillStyle = '#e2e8f0';
  ctx.beginPath(); ctx.arc(cx, headY - headR*0.12, headR*0.9, Math.PI, 0); ctx.fill();
  ctx.strokeStyle = '#cbd5e1'; ctx.lineWidth = w*0.025;
  ctx.beginPath(); ctx.moveTo(cx, headY - headR*0.9); ctx.lineTo(cx, headY - headR*0.2); ctx.stroke();

  // ── Face ──────────────────────────────────────────────────
  // Green eyes
  const eyeR = headR * 0.27;
  [cx - headR*0.38, cx + headR*0.38].forEach((ex, i) => {
    ctx.fillStyle = '#166534';
    ctx.beginPath(); ctx.ellipse(ex, headY + headR*0.06, eyeR*0.85, eyeR, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#4ade80';
    ctx.beginPath(); ctx.ellipse(ex, headY + headR*0.03, eyeR*0.55, eyeR*0.65, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#052e16';
    ctx.beginPath(); ctx.ellipse(ex, headY + headR*0.05, eyeR*0.32, eyeR*0.38, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(ex + eyeR*0.3, headY - headR*0.04, eyeR*0.22, 0, Math.PI*2); ctx.fill();
  });
  // Subtle smile
  ctx.strokeStyle = '#92400e'; ctx.lineWidth = headR*0.14; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(cx, headY + headR*0.52, headR*0.28, 0.25, Math.PI-0.25); ctx.stroke();
  // Rosy cheeks
  ctx.fillStyle = 'rgba(251,113,133,0.25)';
  ctx.beginPath(); ctx.ellipse(cx - headR*0.65, headY + headR*0.35, headR*0.35, headR*0.22, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx + headR*0.65, headY + headR*0.35, headR*0.35, headR*0.22, 0, 0, Math.PI*2); ctx.fill();
}

function drawParkerSprite(x, y, w, h, state, animFrame, wingPhase) {
  const cx = x + w / 2;
  const af = animFrame  || 0;
  const wp = wingPhase  || 0;
  const run = state === 'run';
  const inAir = state === 'jump' || state === 'fall';
  const armSwing = run ? Math.sin(af * Math.PI / 3) * 10 : 0;
  const legSwing = run ? Math.sin(af * Math.PI / 3) * 8  : 0;
  const flapAmt  = inAir ? Math.sin(wp * 3) * 7 : Math.sin(wp) * 3;

  const headR  = h * 0.095;
  const headY  = y + h * 0.122;
  const shldY  = y + h * 0.265;
  const waistY = y + h * 0.500;
  const hemY   = y + h * 0.790;
  const ankleY = y + h * 0.870;
  const footY  = y + h;
  const bw     = w * 0.46;

  ctx.lineCap = 'round'; ctx.lineJoin = 'round';

  // ── Dragonfly wings (drawn behind body) ───────────────────
  const wingCY = shldY + (waistY - shldY) * 0.3;
  // Helper: draw one iridescent wing
  function drawWing(wCx, wCy, rx, ry, angle, colors) {
    ctx.save();
    ctx.translate(wCx, wCy);
    ctx.rotate(angle);
    // Multi-layer for iridescence
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, rx);
    g.addColorStop(0,   colors[0]);
    g.addColorStop(0.5, colors[1]);
    g.addColorStop(1,   colors[2]);
    ctx.fillStyle = g;
    ctx.globalAlpha = 0.72;
    ctx.beginPath(); ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI*2); ctx.fill();
    // Shimmer overlay
    ctx.fillStyle = 'rgba(255,255,255,0.28)';
    ctx.beginPath(); ctx.ellipse(-rx*0.2, -ry*0.25, rx*0.35, ry*0.3, 0, 0, Math.PI*2); ctx.fill();
    // Wing vein
    ctx.strokeStyle = 'rgba(255,255,255,0.45)'; ctx.lineWidth = 0.8;
    ctx.globalAlpha = 0.6;
    ctx.beginPath(); ctx.moveTo(-rx, 0); ctx.lineTo(rx*0.8, 0); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, -ry); ctx.lineTo(0, ry*0.8); ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.restore();
  }
  const wingW = w * 0.62, wingH = h * 0.14;
  // Upper left wing
  drawWing(cx - w*0.1, wingCY - flapAmt, wingW, wingH, -0.38,
    ['rgba(96,165,250,0.9)','rgba(167,139,250,0.85)','rgba(45,212,191,0.6)']);
  // Upper right wing
  drawWing(cx + w*0.1, wingCY - flapAmt, wingW, wingH, 0.38,
    ['rgba(167,139,250,0.9)','rgba(45,212,191,0.85)','rgba(96,165,250,0.6)']);
  // Lower left wing
  drawWing(cx - w*0.06, wingCY + h*0.08 + flapAmt*0.4, wingW*0.72, wingH*0.72, 0.22,
    ['rgba(45,212,191,0.8)','rgba(96,165,250,0.75)','rgba(167,139,250,0.5)']);
  // Lower right wing
  drawWing(cx + w*0.06, wingCY + h*0.08 + flapAmt*0.4, wingW*0.72, wingH*0.72, -0.22,
    ['rgba(167,139,250,0.8)','rgba(45,212,191,0.75)','rgba(96,165,250,0.5)']);

  // ── Hair (long blonde, behind head) ──────────────────────
  ctx.strokeStyle = '#fbbf24'; ctx.lineWidth = w * 0.15;
  ctx.beginPath();
  ctx.moveTo(cx - headR*0.3, headY + headR*0.5);
  ctx.bezierCurveTo(cx - w*0.45, shldY + (waistY-shldY)*0.3,
                    cx - w*0.5,  waistY,
                    cx - w*0.4,  waistY + (hemY-waistY)*0.5);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(cx + headR*0.3, headY + headR*0.5);
  ctx.bezierCurveTo(cx + w*0.42, shldY + (waistY-shldY)*0.3,
                    cx + w*0.48, waistY,
                    cx + w*0.38, waistY + (hemY-waistY)*0.5);
  ctx.stroke();

  // ── Legs ──────────────────────────────────────────────────
  ctx.strokeStyle = '#fde68a'; ctx.lineWidth = w * 0.15;
  ctx.beginPath(); ctx.moveTo(cx - w*0.13, hemY); ctx.lineTo(cx - w*0.11, ankleY + legSwing*0.4); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx + w*0.13, hemY); ctx.lineTo(cx + w*0.11, ankleY - legSwing*0.4); ctx.stroke();
  // Fairy slippers
  ctx.fillStyle = '#f0abfc';
  ctx.beginPath(); ctx.ellipse(cx - w*0.13, ankleY + legSwing*0.4 + (footY-ankleY)*0.5, w*0.12, (footY-ankleY)*0.45, 0.15, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx + w*0.13, ankleY - legSwing*0.4 + (footY-ankleY)*0.5, w*0.12, (footY-ankleY)*0.45, -0.15, 0, Math.PI*2); ctx.fill();

  // ── Rainbow tie-dye dress ─────────────────────────────────
  const dressColors = ['#ef4444','#f97316','#facc15','#4ade80','#38bdf8','#818cf8','#e879f9'];
  const dressH = hemY - shldY;
  dressColors.forEach((col, i) => {
    const bandY = shldY + (i / dressColors.length) * dressH;
    const nextY = shldY + ((i + 1) / dressColors.length) * dressH;
    const spreadL = bw * 0.52 + (i / dressColors.length) * bw * 0.35;
    const spreadR = bw * 0.52 + ((i+1) / dressColors.length) * bw * 0.35;
    ctx.fillStyle = col;
    ctx.globalAlpha = 0.82;
    ctx.beginPath();
    ctx.moveTo(cx - spreadL, bandY);
    ctx.lineTo(cx - spreadR, nextY);
    ctx.lineTo(cx + spreadR, nextY);
    ctx.lineTo(cx + spreadL, bandY);
    ctx.closePath(); ctx.fill();
  });
  ctx.globalAlpha = 1;
  // Dress hem curve
  ctx.fillStyle = '#e879f9'; ctx.globalAlpha = 0.6;
  ctx.beginPath();
  ctx.ellipse(cx, hemY, bw * 0.87, h * 0.04, 0, 0, Math.PI * 2);
  ctx.fill(); ctx.globalAlpha = 1;
  // Swirly tie-dye lines
  ctx.globalAlpha = 0.35;
  ['#fff','#fde68a','#a5f3fc'].forEach((col, i) => {
    ctx.strokeStyle = col; ctx.lineWidth = w * 0.03;
    ctx.beginPath();
    ctx.moveTo(cx + bw * 0.1, shldY + dressH * (i * 0.28));
    ctx.bezierCurveTo(cx - bw*0.3, shldY + dressH*(i*0.28+0.12),
                      cx + bw*0.3, shldY + dressH*(i*0.28+0.22),
                      cx - bw*0.1, shldY + dressH*(i*0.28+0.32));
    ctx.stroke();
  });
  ctx.globalAlpha = 1;

  // ── Arms ──────────────────────────────────────────────────
  ctx.strokeStyle = '#fde68a'; ctx.lineWidth = w * 0.12;
  // Left arm
  ctx.beginPath();
  ctx.moveTo(cx - bw*0.5, shldY + (waistY-shldY)*0.1);
  ctx.bezierCurveTo(cx - bw*0.65, shldY + (waistY-shldY)*0.45 + armSwing*0.3,
                    cx - bw*0.6,  waistY - (waistY-shldY)*0.15,
                    cx - bw*0.52, waistY + armSwing*0.22);
  ctx.stroke();
  // Right arm (holds wand)
  ctx.beginPath();
  ctx.moveTo(cx + bw*0.5, shldY + (waistY-shldY)*0.1);
  ctx.bezierCurveTo(cx + bw*0.62, shldY + (waistY-shldY)*0.38 - armSwing*0.3,
                    cx + bw*0.58, waistY - (waistY-shldY)*0.22,
                    cx + bw*0.5,  waistY - armSwing*0.22);
  ctx.stroke();

  // ── Magic wand ────────────────────────────────────────────
  const wandBaseX = cx + bw * 0.5, wandBaseY = waistY - armSwing * 0.22;
  const wandLen = h * 0.28;
  const wandAngle = -0.6; // tilted up-right
  const wandTipX = wandBaseX + Math.cos(wandAngle) * wandLen;
  const wandTipY = wandBaseY + Math.sin(wandAngle) * wandLen;
  // Wand shaft (gradient)
  const wg = ctx.createLinearGradient(wandBaseX, wandBaseY, wandTipX, wandTipY);
  wg.addColorStop(0, '#78350f'); wg.addColorStop(1, '#c084fc');
  ctx.strokeStyle = wg; ctx.lineWidth = w * 0.055;
  ctx.beginPath(); ctx.moveTo(wandBaseX, wandBaseY); ctx.lineTo(wandTipX, wandTipY); ctx.stroke();
  // Wand glow
  ctx.fillStyle = 'rgba(196,132,252,0.3)';
  ctx.beginPath(); ctx.arc(wandTipX, wandTipY, w*0.18, 0, Math.PI*2); ctx.fill();
  // Wand star tip
  drawStar(ctx, wandTipX, wandTipY, w * 0.12, 5, '#fbbf24');
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(wandTipX, wandTipY, w*0.04, 0, Math.PI*2); ctx.fill();
  // Fairy dust sparkles around star
  const t2 = Date.now() * 0.003;
  ['#f0abfc','#fbbf24','#a5f3fc'].forEach((col, i) => {
    const sa = t2 + i * 2.1;
    ctx.fillStyle = col; ctx.globalAlpha = 0.7 + Math.sin(t2*2+i)*0.3;
    ctx.beginPath();
    ctx.arc(wandTipX + Math.cos(sa)*w*0.15, wandTipY + Math.sin(sa)*w*0.15, w*0.025, 0, Math.PI*2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;

  // ── Head ──────────────────────────────────────────────────
  ctx.fillStyle = '#fed7aa';
  ctx.beginPath(); ctx.ellipse(cx, headY, headR*0.86, headR, 0, 0, Math.PI*2); ctx.fill();

  // ── Hair top (blonde) ─────────────────────────────────────
  ctx.fillStyle = '#fbbf24';
  ctx.beginPath(); ctx.arc(cx, headY - headR*0.12, headR*0.9, Math.PI, 0); ctx.fill();
  // Side waves
  ctx.beginPath(); ctx.ellipse(cx - headR*0.6, headY + headR*0.2, headR*0.35, headR*0.5, -0.3, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx + headR*0.6, headY + headR*0.2, headR*0.35, headR*0.5, 0.3, 0, Math.PI*2); ctx.fill();

  // ── Face ──────────────────────────────────────────────────
  // Blue eyes with lashes
  const eyeR = headR * 0.27;
  [cx - headR*0.37, cx + headR*0.37].forEach((ex) => {
    ctx.fillStyle = '#1e3a5f';
    ctx.beginPath(); ctx.ellipse(ex, headY + headR*0.06, eyeR*0.85, eyeR, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#60a5fa';
    ctx.beginPath(); ctx.ellipse(ex, headY + headR*0.03, eyeR*0.55, eyeR*0.65, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#1e3a5f';
    ctx.beginPath(); ctx.ellipse(ex, headY + headR*0.05, eyeR*0.32, eyeR*0.38, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(ex + eyeR*0.3, headY - headR*0.04, eyeR*0.22, 0, Math.PI*2); ctx.fill();
    // Lashes
    ctx.strokeStyle = '#1e3a5f'; ctx.lineWidth = headR * 0.1;
    for (let le = -1; le <= 1; le++) {
      ctx.beginPath();
      ctx.moveTo(ex + le*eyeR*0.5, headY - headR*0.09);
      ctx.lineTo(ex + le*eyeR*0.6, headY - headR*0.26);
      ctx.stroke();
    }
  });
  // Smile
  ctx.strokeStyle = '#9a3412'; ctx.lineWidth = headR*0.14;
  ctx.beginPath(); ctx.arc(cx, headY + headR*0.52, headR*0.28, 0.25, Math.PI-0.25); ctx.stroke();
  // Rosy cheeks
  ctx.fillStyle = 'rgba(244,114,182,0.3)';
  ctx.beginPath(); ctx.ellipse(cx - headR*0.65, headY + headR*0.35, headR*0.35, headR*0.22, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx + headR*0.65, headY + headR*0.35, headR*0.35, headR*0.22, 0, 0, Math.PI*2); ctx.fill();
}

// ═══════════════════════════════════════════════════════════════
//  PROJECTILES
// ═══════════════════════════════════════════════════════════════
const projectiles = [];

class Projectile {
  constructor(x, y, vx, type) {
    this.x = x; this.y = y; this.vx = vx; this.vy = 0;
    this.type = type; // 'ice' | 'vine'
    this.active = true;
    this.age = 0;
    this.w = type === 'ice' ? 30 : 24;
    this.h = type === 'ice' ? 9  : 13;
  }

  update() {
    this.x += this.vx;
    this.age++;
    if (this.x < Camera.x - 120 || this.x > Camera.x + Camera.W + 120) this.active = false;
  }

  draw() {
    if (!Camera.inView(this.x - this.w, this.y - this.h, this.w*2, this.h*2)) return;
    const { x: sx, y: sy } = Camera.toScreen(this.x, this.y);
    ctx.save();
    if (this.vx < 0) { ctx.translate(sx, sy); ctx.scale(-1, 1); this._draw(0, 0); }
    else              { this._draw(sx, sy); }
    ctx.restore();
  }

  _draw(sx, sy) {
    this.type === 'ice' ? this._drawIce(sx, sy) : this._drawVine(sx, sy);
  }

  _drawIce(sx, sy) {
    const { w, h } = this;
    // Shaft
    const sg = ctx.createLinearGradient(sx, sy, sx + w, sy);
    sg.addColorStop(0, '#e0f2fe'); sg.addColorStop(1, '#7dd3fc');
    ctx.fillStyle = sg;
    ctx.roundRect(sx, sy - h*0.28, w - 9, h*0.55, 2); ctx.fill();
    // Crystal facet
    ctx.fillStyle = 'rgba(186,230,253,0.55)';
    ctx.beginPath(); ctx.moveTo(sx+w*0.28, sy-h*0.5); ctx.lineTo(sx+w*0.48, sy+h*0.5); ctx.lineTo(sx+w*0.38, sy); ctx.closePath(); ctx.fill();
    // Arrowhead
    ctx.fillStyle = '#38bdf8';
    ctx.beginPath(); ctx.moveTo(sx+w, sy); ctx.lineTo(sx+w-10, sy-h*0.5); ctx.lineTo(sx+w-8, sy); ctx.lineTo(sx+w-10, sy+h*0.5); ctx.closePath(); ctx.fill();
    // Shimmer
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.beginPath(); ctx.arc(sx+w-13, sy, 2, 0, Math.PI*2); ctx.fill();
    // Ice sparkles
    const t = this.age * 0.18;
    ['rgba(186,230,253,0.8)','rgba(255,255,255,0.6)'].forEach((col, i) => {
      ctx.fillStyle = col;
      ctx.beginPath(); ctx.arc(sx+w*0.25+i*w*0.28, sy+Math.sin(t+i)*h*0.7-h*0.6, 1.5, 0, Math.PI*2); ctx.fill();
    });
    // Fletching
    ctx.strokeStyle = '#c7d2fe'; ctx.lineWidth = 1.5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(sx+3, sy); ctx.lineTo(sx-5, sy-h*0.55); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(sx+3, sy); ctx.lineTo(sx-5, sy+h*0.55); ctx.stroke();
  }

  _drawVine(sx, sy) {
    const { w, h, age } = this;
    // Wavy vine stem
    ctx.strokeStyle = '#166534'; ctx.lineWidth = 3.5; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(sx, sy);
    for (let i = 0; i <= w; i += 3) {
      ctx.lineTo(sx + i, sy + Math.sin(i * 0.28 + age * 0.14) * 4.5);
    }
    ctx.stroke();
    // Inner vine
    ctx.strokeStyle = '#14532d'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(sx, sy);
    for (let i = 0; i <= w; i += 3) {
      ctx.lineTo(sx + i, sy + Math.sin(i * 0.28 + age * 0.14) * 4.5);
    }
    ctx.stroke();
    // Thorns
    ctx.strokeStyle = '#15803d'; ctx.lineWidth = 1.8;
    for (let i = 7; i < w - 4; i += 10) {
      const vy = sy + Math.sin(i * 0.28 + age * 0.14) * 4.5;
      ctx.beginPath(); ctx.moveTo(sx+i, vy); ctx.lineTo(sx+i+3, vy-7); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(sx+i, vy); ctx.lineTo(sx+i-2, vy+6); ctx.stroke();
    }
    // Leaf tip
    ctx.fillStyle = '#15803d';
    const tipVY = sy + Math.sin(w * 0.28 + age * 0.14) * 4.5;
    ctx.beginPath(); ctx.ellipse(sx+w+4, tipVY, 7, 3.5, 0.3, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#052e16'; ctx.lineWidth = 0.8;
    ctx.beginPath(); ctx.moveTo(sx+w, tipVY); ctx.lineTo(sx+w+8, tipVY); ctx.stroke();
  }
}

// ── Shoot action — creates real projectiles ───────────────────
function shootAction(player) {
  const type = player.character === 'penelope' ? 'ice' : 'vine';
  const ox = player.x + (player.facingRight ? player.w + 4 : -4);
  const oy = player.y + player.h * 0.42;
  const vx = player.facingRight ? 11 : -11;
  projectiles.push(new Projectile(ox, oy, vx, type));
  Particles.spawn(ox, oy, {
    count: 4,
    color: type === 'ice' ? '#bae6fd' : '#4ade80',
    size: 3, spread: 2, rise: 1, decay: 0.07,
  });
}

// ═══════════════════════════════════════════════════════════════
//  PLATFORM
// ═══════════════════════════════════════════════════════════════
class Platform {
  // style: 'island' | 'cloud' | 'thin'
  constructor(x, y, w, h, style = 'island') {
    this.x = x; this.y = y; this.w = w; this.h = h;
    this.style = style;
    this._seed = x * 0.01 + y * 0.003;  // deterministic decoration seed
  }

  // Shared AABB overlap check used by Player
  overlaps(px, py, pw, ph) {
    return px < this.x + this.w && px + pw > this.x &&
           py < this.y + this.h && py + ph > this.y;
  }

  draw() {
    if (!Camera.inView(this.x, this.y, this.w, this.h)) return;
    const { x, y } = Camera.toScreen(this.x, this.y);
    if      (this.style === 'island') this._drawIsland(x, y);
    else if (this.style === 'cloud')  this._drawCloud(x, y);
    else                               this._drawThin(x, y);
  }

  _drawIsland(sx, sy) {
    const { w, h } = this;

    // Dangling roots
    ctx.strokeStyle = '#78350f';
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    let rx = sx + 12;
    let ri = 0;
    while (rx < sx + w - 12) {
      const rl = 14 + ((this._seed * 100 + ri * 17) % 18);
      ctx.beginPath();
      ctx.moveTo(rx, sy + h);
      ctx.bezierCurveTo(rx - 4, sy + h + rl * 0.5, rx + 4, sy + h + rl * 0.7, rx, sy + h + rl);
      ctx.stroke();
      rx += 18 + ((ri * 7) % 9);
      ri++;
    }

    // Dirt body
    ctx.fillStyle = '#a16207';
    ctx.roundRect(sx, sy + 14, w, h - 14, [0, 0, 6, 6]);
    ctx.fill();

    // Soil stripe
    ctx.fillStyle = '#92400e';
    ctx.fillRect(sx, sy + 14, w, 6);

    // Grass top
    const gGrad = ctx.createLinearGradient(sx, sy, sx, sy + 18);
    gGrad.addColorStop(0, '#a3e635');
    gGrad.addColorStop(1, '#4ade80');
    ctx.fillStyle = gGrad;
    ctx.roundRect(sx, sy + 2, w, 16, 7);
    ctx.fill();

    // Grass bumps
    ctx.fillStyle = '#86efac';
    for (let bx = sx + 8; bx < sx + w - 8; bx += 16) {
      ctx.beginPath();
      ctx.arc(bx, sy + 5, 7, Math.PI, 0);
      ctx.fill();
    }

    // Decorations: flowers & mushrooms
    const decCount = Math.max(1, Math.floor(w / 90));
    for (let i = 0; i < decCount; i++) {
      const seed2 = this._seed * 1000 + i * 37;
      const fx = sx + 28 + i * Math.floor((w - 56) / Math.max(decCount, 1))
               + (seed2 % 20) - 10;
      if ((Math.floor(seed2) % 2) === 0) {
        // Flower
        const petal = ['#f87171','#fb923c','#facc15','#a78bfa','#f9a8d4'][Math.floor(seed2) % 5];
        for (let p = 0; p < 5; p++) {
          ctx.fillStyle = petal;
          const pa = (p / 5) * Math.PI * 2;
          ctx.beginPath();
          ctx.arc(fx + Math.cos(pa) * 4, sy + Math.sin(pa) * 3, 3, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.fillStyle = '#fef08a';
        ctx.beginPath(); ctx.arc(fx, sy, 3.5, 0, Math.PI * 2); ctx.fill();
      } else {
        // Mushroom
        ctx.fillStyle = '#ef4444';
        ctx.beginPath(); ctx.arc(fx, sy - 2, 5.5, Math.PI, 0); ctx.fill();
        ctx.fillStyle = '#991b1b';
        ctx.fillRect(fx - 2.5, sy - 2, 5, 7);
        ctx.fillStyle = 'rgba(255,255,255,0.9)';
        ctx.beginPath(); ctx.arc(fx - 2, sy - 4, 1.5, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(fx + 2, sy - 2, 1, 0, Math.PI * 2); ctx.fill();
      }
    }
  }

  _drawCloud(sx, sy) {
    const { w, h } = this;
    const cx = sx + w / 2;
    const cy = sy + h * 0.45;
    const r  = h * 0.55;

    ctx.fillStyle = 'rgba(255,255,255,0.92)';
    // Bottom fill (solid rectangle base so character stands on flat surface)
    ctx.fillRect(sx, cy, w, h - (cy - sy));

    // Puff circles
    const puffs = [
      [cx,         cy, r * 1.15],
      [cx - w * 0.27, cy + 2, r * 0.9],
      [cx + w * 0.27, cy + 2, r * 0.9],
      [cx - w * 0.12, cy - r * 0.45, r * 0.75],
      [cx + w * 0.14, cy - r * 0.38, r * 0.65],
    ];
    for (const [px, py, pr] of puffs) {
      ctx.beginPath();
      ctx.arc(px, py, pr, 0, Math.PI * 2);
      ctx.fill();
    }

    // Sheen
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.beginPath();
    ctx.arc(cx - w * 0.12, cy - r * 0.4, r * 0.32, 0, Math.PI * 2);
    ctx.fill();
  }

  _drawThin(sx, sy) {
    // Thin magical platform (glowing crystal)
    const grad = ctx.createLinearGradient(sx, sy, sx + this.w, sy);
    grad.addColorStop(0,   '#6d28d9');
    grad.addColorStop(0.5, '#a78bfa');
    grad.addColorStop(1,   '#6d28d9');
    ctx.fillStyle = grad;
    ctx.roundRect(sx, sy, this.w, this.h, 5);
    ctx.fill();
    ctx.strokeStyle = '#c4b5fd';
    ctx.lineWidth = 1.5;
    ctx.roundRect(sx, sy, this.w, this.h, 5);
    ctx.stroke();
  }
}

// ═══════════════════════════════════════════════════════════════
//  PLAYER
//  character: 'penelope' | 'parker'
//  Future: add health, mana, collectibles, shooting here
// ═══════════════════════════════════════════════════════════════
class Player {
  constructor(x, y, character = 'penelope') {
    this.x = x; this.y = y;
    this.w = 26; this.h = 52;
    this.vx = 0; this.vy = 0;
    this.character = character;
    this.onGround = false;
    this.facingRight = true;
    this.jumpHeld = false;
    this.state = 'idle';      // 'idle' | 'run' | 'jump' | 'fall'
    this.animFrame = 0;
    this.animTick  = 0;
    this.wingPhase = 0;       // for Parker's fairy wings
    this.dustTimer = 0;
  }

  update(platforms) {
    // ── Horizontal input ──────────────────────────────────────
    if (Input.left()) {
      this.vx = -CFG.MOVE_SPEED;
      this.facingRight = false;
    } else if (Input.right()) {
      this.vx =  CFG.MOVE_SPEED;
      this.facingRight = true;
    } else {
      this.vx *= CFG.FRICTION;
    }

    // ── Jump ─────────────────────────────────────────────────
    const jumpKey = Input.jump();
    if (jumpKey && this.onGround && !this.jumpHeld) {
      this.vy = CFG.JUMP_FORCE;
      this.onGround = false;
      this.jumpHeld = true;
      Particles.spawn(this.x + this.w / 2, this.y + this.h, {
        count: 10, color: this._accentColor(), star: true, size: 5, rise: 4,
      });
    }
    if (!jumpKey) this.jumpHeld = false;

    // ── Gravity ───────────────────────────────────────────────
    this.vy = Math.min(this.vy + CFG.GRAVITY, CFG.TERMINAL_VEL);

    // ── Move & collide X ──────────────────────────────────────
    this.x += this.vx;
    this.x = Math.max(0, Math.min(this.x, CFG.WORLD_W - this.w));
    this._resolveX(platforms);

    // ── Move & collide Y ──────────────────────────────────────
    const wasOnGround = this.onGround;
    this.onGround = false;
    this.y += this.vy;
    this._resolveY(platforms);

    // Landing burst
    if (!wasOnGround && this.onGround) {
      Particles.spawn(this.x + this.w / 2, this.y + this.h, {
        count: 8, color: this._accentColor(), spread: 5, rise: 1.5, gravity: 0.12,
      });
    }

    // ── Respawn if fallen ────────────────────────────────────
    if (this.y > CFG.WORLD_H + 120) {
      this.x = 160; this.y = 490; this.vx = 0; this.vy = 0;
    }

    // ── State & animation ────────────────────────────────────
    if (!this.onGround)              this.state = this.vy < 0 ? 'jump' : 'fall';
    else if (Math.abs(this.vx) > 0.4) this.state = 'run';
    else                              this.state = 'idle';

    this.animTick++;
    if (this.state === 'run' && this.animTick % 7 === 0)
      this.animFrame = (this.animFrame + 1) % 6;
    if (this.state !== 'run') this.animFrame = 0;

    this.wingPhase += 0.12;

    // Running dust
    if (this.state === 'run' && this.onGround) {
      this.dustTimer++;
      if (this.dustTimer % 8 === 0) {
        Particles.spawn(this.x + this.w / 2, this.y + this.h, {
          count: 2, color: 'rgba(200,200,255,0.7)', size: 3, rise: 0.5,
          spread: 1.5, decay: 0.04, gravity: -0.01,
        });
      }
    }
  }

  _resolveX(platforms) {
    for (const p of platforms) {
      if (p.overlaps(this.x, this.y + 2, this.w, this.h - 4)) {
        if (this.vx > 0) this.x = p.x - this.w;
        else             this.x = p.x + p.w;
        this.vx = 0;
      }
    }
  }

  _resolveY(platforms) {
    for (const p of platforms) {
      if (p.overlaps(this.x + 2, this.y, this.w - 4, this.h)) {
        if (this.vy >= 0) {
          this.y = p.y - this.h;
          this.onGround = true;
        } else {
          this.y = p.y + p.h;
        }
        this.vy = 0;
      }
    }
  }

  _accentColor() {
    return this.character === 'penelope' ? '#c084fc' : '#67e8f9';
  }

  draw() {
    const s = Camera.toScreen(this.x, this.y);
    ctx.save();
    if (!this.facingRight) {
      ctx.translate(s.x + this.w, s.y);
      ctx.scale(-1, 1);
      this._drawChar(0, 0);
    } else {
      this._drawChar(s.x, s.y);
    }
    ctx.restore();
  }

  _drawChar(ox, oy) {
    const { w, h } = this;
    const sq  = this.state === 'jump' ? { sx: 0.85, sy: 1.15 }
              : this.state === 'fall' ? { sx: 1.10, sy: 0.90 }
              :                         { sx: 1,    sy: 1    };
    const bob = this.state === 'run' ? Math.sin(this.animFrame * Math.PI / 3) * 2 : 0;
    ctx.save();
    ctx.translate(ox + w / 2, oy + h / 2 + bob);
    ctx.scale(sq.sx, sq.sy);
    if (this.character === 'penelope')
      drawPenelopeSprite(-w/2, -h/2, w, h, this.state, this.animFrame);
    else
      drawParkerSprite(-w/2, -h/2, w, h, this.state, this.animFrame, this.wingPhase);
    ctx.restore();
  }

  _PLACEHOLDER_DELETE_ME() {
  }
}

// ═══════════════════════════════════════════════════════════════
//  BACKGROUND  (sky, parallax clouds, stars)
// ═══════════════════════════════════════════════════════════════
const BG = (() => {
  // Generate background cloud data once
  const bgClouds = Array.from({ length: 35 }, (_, i) => ({
    x:     (i * 997 % CFG.WORLD_W),
    y:     (i * 331 % 550) + 20,
    w:     (i * 157 % 180) + 70,
    h:     (i * 83  % 50)  + 28,
    speed: (i * 13  % 30)  * 0.01 + 0.04,
    alpha: (i * 71  % 35)  * 0.01 + 0.12,
  }));

  function update() {
    for (const c of bgClouds) {
      c.x += c.speed;
      if (c.x > CFG.WORLD_W + 200) c.x = -200;
    }
  }

  function draw() {
    // Sky gradient
    const sg = ctx.createLinearGradient(0, 0, 0, canvas.height);
    sg.addColorStop(0,    '#7dd3fc');
    sg.addColorStop(0.45, '#bae6fd');
    sg.addColorStop(1,    '#e0f2fe');
    ctx.fillStyle = sg;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Distant sparkle stars
    const t = Date.now() * 0.0008;
    for (let i = 0; i < 25; i++) {
      const sx = ((i * 317 + 30) % CFG.WORLD_W) - Camera.x * 0.04;
      const sy = (i * 173 % 350) - Camera.y * 0.04;
      if (sx < -8 || sx > canvas.width + 8 || sy < -8 || sy > canvas.height + 8) continue;
      const pulse = (Math.sin(t * 1.8 + i * 1.3) + 1) * 0.5;
      ctx.globalAlpha = 0.2 + pulse * 0.5;
      ctx.fillStyle = i % 3 === 0 ? '#fde68a' : '#c7d2fe';
      ctx.beginPath(); ctx.arc(sx, sy, 1.5 + pulse * 1.2, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Parallax background clouds
    for (const c of bgClouds) {
      const sx = c.x - Camera.x * 0.28;
      const sy = c.y - Camera.y * 0.08;
      if (sx + c.w < -60 || sx > canvas.width + 60) continue;
      const cx2 = sx + c.w / 2;
      const cy2 = sy + c.h / 2;
      const r   = c.h * 0.52;

      ctx.globalAlpha = c.alpha;
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(cx2, cy2, r * 1.1, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx2 - c.w * 0.26, cy2 + 2, r * 0.85, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx2 + c.w * 0.26, cy2 + 2, r * 0.85, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(cx2 - c.w * 0.1, cy2 - r * 0.4, r * 0.7, 0, Math.PI * 2); ctx.fill();
      ctx.fillRect(sx + c.w * 0.15, cy2, c.w * 0.7, r + 3);
    }
    ctx.globalAlpha = 1;

    // Distant rainbow (decorative)
    const ry = canvas.height * 0.6 - Camera.y * 0.05;
    const rx = canvas.width * 0.5 - Camera.x * 0.02;
    const rainbowColors = ['rgba(239,68,68,0.15)','rgba(251,146,60,0.12)','rgba(250,204,21,0.12)',
                            'rgba(74,222,128,0.12)','rgba(96,165,250,0.12)','rgba(167,139,250,0.12)'];
    for (let rb = 0; rb < rainbowColors.length; rb++) {
      ctx.strokeStyle = rainbowColors[rb];
      ctx.lineWidth = 10;
      ctx.beginPath();
      ctx.arc(rx, ry + 60, 200 + rb * 14, Math.PI, 0);
      ctx.stroke();
    }
  }

  return { update, draw };
})();

// ═══════════════════════════════════════════════════════════════
//  SELECT SCREEN
// ═══════════════════════════════════════════════════════════════
const SelectScreen = (() => {
  // Preview sizes — tall and slender in the select screen
  const PW = 82, PH = 190;
  let hovered = null; // 'penelope' | 'parker' | null
  let t = 0;

  function panelRect(char) {
    const gap = NATIVE_W * 0.08;
    const pw  = NATIVE_W * 0.36, ph = NATIVE_H * 0.82;
    const py  = NATIVE_H * 0.09;
    if (char === 'penelope') return { x: NATIVE_W * 0.5 - gap * 0.5 - pw, y: py, w: pw, h: ph };
    else                     return { x: NATIVE_W * 0.5 + gap * 0.5,      y: py, w: pw, h: ph };
  }

  function hitTest(px, py) {
    for (const ch of ['penelope','parker']) {
      const r = panelRect(ch);
      if (px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h) return ch;
    }
    return null;
  }

  function onPointer(e) {
    if (gameState !== 'select') return;
    const rect = canvas.getBoundingClientRect();
    const src = e.changedTouches?.[0] ?? e;
    const rawX = src.clientX - rect.left;
    const rawY = src.clientY - rect.top;
    const px = rawX / _cssScale, py = rawY / _cssScale;
    const ch = hitTest(px, py);
    if (e.type === 'mousemove' || e.type === 'touchmove') { hovered = ch; return; }
    if (ch) selectCharacter(ch);
  }

  canvas.addEventListener('click',     onPointer);
  canvas.addEventListener('touchend',  onPointer, { passive: false });
  canvas.addEventListener('mousemove', onPointer);

  function draw() {
    t++;
    // Dark starfield background
    const bg = ctx.createLinearGradient(0, 0, 0, NATIVE_H);
    bg.addColorStop(0, '#0c0a1e'); bg.addColorStop(1, '#1a1040');
    ctx.fillStyle = bg; ctx.fillRect(0, 0, NATIVE_W, NATIVE_H);

    // Twinkling stars
    for (let i = 0; i < 60; i++) {
      const sx = (i * 317 + 7) % NATIVE_W;
      const sy = (i * 211 + 3) % NATIVE_H;
      const pulse = (Math.sin(t * 0.04 + i * 1.1) + 1) * 0.5;
      ctx.globalAlpha = 0.15 + pulse * 0.7;
      ctx.fillStyle = i % 3 === 0 ? '#fde68a' : '#c7d2fe';
      ctx.beginPath(); ctx.arc(sx, sy, 1 + pulse, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // Title
    ctx.textAlign = 'center';
    ctx.font = 'bold 32px Georgia';
    ctx.fillStyle = '#fbbf24';
    ctx.shadowColor = '#f59e0b'; ctx.shadowBlur = 18;
    ctx.fillText('✨ Choose Your Hero ✨', NATIVE_W / 2, 52);
    ctx.shadowBlur = 0;
    ctx.font = '14px Georgia';
    ctx.fillStyle = 'rgba(199,210,254,0.7)';
    ctx.fillText('Tap a character to begin your adventure', NATIVE_W / 2, 74);
    ctx.textAlign = 'left';

    for (const ch of ['penelope','parker']) {
      const r = panelRect(ch);
      const isPen = ch === 'penelope';
      const isHov = hovered === ch;
      const pulse = Math.sin(t * 0.06 + (isPen ? 0 : Math.PI)) * 0.5 + 0.5;

      // Panel glow
      if (isHov) {
        ctx.shadowColor = isPen ? '#38bdf8' : '#a78bfa';
        ctx.shadowBlur = 24;
      }
      // Panel background
      const pg = ctx.createLinearGradient(r.x, r.y, r.x, r.y + r.h);
      if (isPen) {
        pg.addColorStop(0, isHov ? 'rgba(14,116,144,0.85)' : 'rgba(12,74,110,0.7)');
        pg.addColorStop(1, isHov ? 'rgba(3,105,161,0.65)'  : 'rgba(2,48,71,0.6)');
      } else {
        pg.addColorStop(0, isHov ? 'rgba(88,28,135,0.85)'  : 'rgba(59,7,100,0.7)');
        pg.addColorStop(1, isHov ? 'rgba(107,33,168,0.65)' : 'rgba(46,16,101,0.6)');
      }
      ctx.fillStyle = pg;
      ctx.roundRect(r.x, r.y, r.w, r.h, 18); ctx.fill();
      ctx.shadowBlur = 0;

      // Panel border
      ctx.strokeStyle = isPen ? (isHov ? '#38bdf8' : '#0ea5e9') : (isHov ? '#d8b4fe' : '#9333ea');
      ctx.lineWidth = isHov ? 3 : 1.5;
      ctx.roundRect(r.x, r.y, r.w, r.h, 18); ctx.stroke();

      // Character preview — centered in panel, slightly above center
      const pcx = r.x + r.w / 2;
      const pcy = r.y + r.h * 0.44;
      const bob = Math.sin(t * 0.05 + (isPen ? 0 : 1)) * 4;
      ctx.save();
      ctx.translate(pcx, pcy + bob);
      if (isPen) drawPenelopeSprite(-PW/2, -PH/2, PW, PH, 'idle', t);
      else       drawParkerSprite(-PW/2, -PH/2, PW, PH, isPen ? 'idle' : (Math.sin(t*0.03) > 0 ? 'jump' : 'idle'), t, t * 0.08);
      ctx.restore();

      // Name
      ctx.textAlign = 'center';
      ctx.font = 'bold 20px Georgia';
      ctx.fillStyle = isPen ? '#bae6fd' : '#e9d5ff';
      ctx.shadowColor = isPen ? '#0ea5e9' : '#9333ea'; ctx.shadowBlur = 8;
      ctx.fillText(isPen ? 'PENELOPE' : 'PARKER', r.x + r.w / 2, r.y + r.h * 0.74);
      ctx.shadowBlur = 0;

      // Class
      ctx.font = 'italic 13px Georgia';
      ctx.fillStyle = isPen ? '#7dd3fc' : '#c4b5fd';
      ctx.fillText(isPen ? 'Magic Elf Archer' : 'Fairy Spellcaster', r.x + r.w / 2, r.y + r.h * 0.81);

      // Ability
      ctx.font = '11px Georgia';
      ctx.fillStyle = isPen ? '#bae6fd' : '#ddd6fe';
      ctx.fillText(isPen ? '❄ Ice / Freeze Arrows' : '🌿 Poison Vine Shots', r.x + r.w / 2, r.y + r.h * 0.88);

      // CHOOSE button
      const bh = 34, bw2 = r.w * 0.6, bx = r.x + (r.w - bw2) / 2, by = r.y + r.h * 0.915;
      const btnG = ctx.createLinearGradient(bx, by, bx, by + bh);
      if (isPen) { btnG.addColorStop(0, isHov ? '#0ea5e9' : '#0284c7'); btnG.addColorStop(1, isHov ? '#0369a1' : '#01579b'); }
      else       { btnG.addColorStop(0, isHov ? '#9333ea' : '#7c3aed'); btnG.addColorStop(1, isHov ? '#6b21a8' : '#4c1d95'); }
      ctx.fillStyle = btnG;
      ctx.roundRect(bx, by, bw2, bh, 10); ctx.fill();
      ctx.strokeStyle = isPen ? '#7dd3fc' : '#c4b5fd'; ctx.lineWidth = 1.5;
      ctx.roundRect(bx, by, bw2, bh, 10); ctx.stroke();
      ctx.font = 'bold 14px Georgia';
      ctx.fillStyle = '#fff';
      ctx.shadowColor = isPen ? '#38bdf8' : '#a855f7'; ctx.shadowBlur = isHov ? 10 : 0;
      ctx.fillText(isPen ? 'Choose Penelope' : 'Choose Parker', r.x + r.w / 2, by + bh * 0.65);
      ctx.shadowBlur = 0; ctx.textAlign = 'left';

      // Floating sparkles around hovered panel
      if (isHov) {
        for (let s = 0; s < 5; s++) {
          const sa = t * 0.08 + s * 1.26;
          const sr = r.w * 0.52 + Math.sin(t * 0.04 + s) * 8;
          const sx = r.x + r.w/2 + Math.cos(sa) * sr;
          const sy2 = r.y + r.h/2 + Math.sin(sa) * sr * 0.4;
          ctx.fillStyle = isPen ? `rgba(186,230,253,${0.4 + pulse * 0.5})` : `rgba(216,180,254,${0.4 + pulse * 0.5})`;
          ctx.beginPath(); ctx.arc(sx, sy2, 2.5 + pulse, 0, Math.PI * 2); ctx.fill();
        }
      }
    }
  }

  return { draw };
})();

// ═══════════════════════════════════════════════════════════════
//  GAME INIT & LOOP
// ═══════════════════════════════════════════════════════════════
const platforms = buildSkyIslandWorld();
let gameState = 'select'; // 'select' | 'playing'
let activeChar = 'penelope';
let player = null;

function selectCharacter(ch) {
  activeChar = ch;
  player = new Player(160, 490, ch);
  gameState = 'playing';
  // Snap camera to starting position
  Camera.x = player.x + player.w / 2 - Camera.W / 2;
  Camera.y = player.y + player.h / 2 - Camera.H * 0.52;
  Camera.x = Math.max(0, Math.min(Camera.x, CFG.WORLD_W - Camera.W));
  Camera.y = Math.max(0, Math.min(Camera.y, CFG.WORLD_H - Camera.H));
}

function switchCharacter() {
  activeChar = activeChar === 'penelope' ? 'parker' : 'penelope';
  const np = new Player(player.x, player.y, activeChar);
  np.vx = player.vx;
  np.vy = -4;
  player = np;
  Particles.spawn(player.x + player.w / 2, player.y + player.h / 2, {
    count: 14, color: activeChar === 'penelope' ? '#c084fc' : '#67e8f9',
    spread: 5, rise: 4, star: true, size: 6, decay: 0.02,
  });
}

window.addEventListener('keydown', e => {
  if (e.code === 'Tab') { e.preventDefault(); if (gameState === 'playing') switchCharacter(); }
});

function gameLoop() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (gameState === 'select') {
    SelectScreen.draw();
    Input.clearFrame();
    requestAnimationFrame(gameLoop);
    return;
  }

  // ── Playing: Update ─────────────────────────────────────────
  player.update(platforms);
  Camera.update(player);
  BG.update();
  Particles.update();

  for (let i = projectiles.length - 1; i >= 0; i--) {
    projectiles[i].update();
    if (!projectiles[i].active) projectiles.splice(i, 1);
  }

  if (TouchControls.consumeShoot() || Input.wasPressed('Space')) shootAction(player);
  if (TouchControls.consumeSwap()) switchCharacter();
  Input.clearFrame();

  // ── Playing: Draw ───────────────────────────────────────────
  BG.draw();
  for (const p of platforms) p.draw();
  Particles.draw();
  for (const pr of projectiles) pr.draw();
  player.draw();
  drawHUD(player);
  TouchControls.draw();

  requestAnimationFrame(gameLoop);
}

requestAnimationFrame(gameLoop);
</script>
